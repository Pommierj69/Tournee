/* ══════════ Référence manquante ══════════ */
function openRefSheet(clientId, key) {
  const c = getClient(clientId);
  if (!c) return;
  const group = key ? groupItems(c.items).find((g) => g.key === key) : null;
  if (key && !group) return;
  const sel = new Set(group ? group.items.map((i) => i.format) : []);
  const custom = new Set();
  let showAll = false;
  const names = allRefNames();
  const wrap = openSheet({
    title: group ? 'Modifier la référence' : 'Ajouter une référence',
    focus: group || names.length ? null : '#rName',   /* avec des suggestions, on ne fait pas surgir le clavier tout de suite */
    body: `<form id="sheetForm" class="form" novalidate autocomplete="off">
      <div class="field">
        <label for="rName">Nom de la référence</label>
        <input id="rName" type="text" value="${esc(group ? group.name : '')}" autocapitalize="sentences" enterkeyhint="done" placeholder="Ex. Chat stérilisé">
        <div class="chips scroll" id="rSug" aria-label="Suggestions"></div>
        ${catBrowseHTML()}
      </div>
      <div class="field">
        <span id="rFmtLabel">Format(s) manquant(s)</span>
        <div class="fmts" id="rFmts" role="group" aria-labelledby="rFmtLabel"></div>
        <p class="sec-sub" id="rHint" style="margin:0"></p>
        <div class="row2"><input id="rCustom" type="text" inputmode="text" placeholder="Autre format, ex. 2 kg ou 400 g" aria-label="Autre format" enterkeyhint="done"><button type="button" class="btn small" id="rAdd">Ajouter</button></div>
      </div>
      <p class="err" id="rErr" role="alert"></p>
      <p class="msg" id="rMsg" role="status"></p>
      ${group ? '<button type="button" class="link danger" id="rDel" style="align-self:flex-start">Supprimer cette référence</button>' : ''}
    </form>`,
    foot: group
      ? `<button type="button" class="btn grow" data-act="sheet-close">Annuler</button><button type="submit" form="sheetForm" class="btn primary grow">Enregistrer</button>`
      : `<button type="submit" form="sheetForm" data-again="1" class="btn grow">Ajouter une autre</button><button type="submit" form="sheetForm" class="btn primary grow">Enregistrer</button>`,
  });
  const $$ = (s) => $(s, wrap);
  const nameEl = $$('#rName'), fmtsEl = $$('#rFmts'), sugEl = $$('#rSug'), errEl = $$('#rErr'), msgEl = $$('#rMsg'), customEl = $$('#rCustom');

  const present = () => (group ? new Set() : new Set(c.items.filter((i) => nameKey(i.name) === nameKey(nameEl.value)).map((i) => i.format)));

  function drawFormats() {
    const pres = present();
    const pf = showAll ? null : prodFormats(nameEl.value);
    const all = pf ? [...new Set([...pf, ...sel, ...custom, ...pres])].sort(cmpFormat) : knownFormats([...sel, ...custom, ...pres]);
    fmtsEl.innerHTML = all.map((f) => {
      const p = splitFormat(f);
      const face = p ? `<span class="n">${p.num}</span><span class="u">${p.unit}</span>` : `<span class="n">${esc(f)}</span>`;
      const isPres = pres.has(f);
      const on = sel.has(f) && !isPres;
      return `<button type="button" class="fmt${p ? '' : ' txt'}${on ? ' on' : ''}${isPres ? ' present' : ''}" data-fmt="${esc(f)}" aria-pressed="${on}"${isPres ? ' disabled' : ''} aria-label="${esc(f)}${isPres ? ', déjà dans la liste' : ''}">${face}</button>`;
    }).join('');
    const hint = [pres.size ? 'Les formats grisés sont déjà dans la liste de ce magasin.' : '', pf ? 'Formats de cette référence.' : ''].filter(Boolean).join(' ');
    $$('#rHint').innerHTML = esc(hint) + (pf ? ' <button type="button" class="link" id="rAll">Tous les formats</button>' : '');
  }
  function drawSuggestions() {
    const q = fold(nameEl.value);
    let list = names.filter((n) => nameKey(n) !== q);
    if (q) list = list.filter((n) => fold(n).includes(q));
    sugEl.innerHTML = list.slice(0, 8).map((n) => `<button type="button" class="chip" data-name="${esc(n)}">${esc(n)}</button>`).join('');
  }
  function addCustom() {
    const f = normFormat(customEl.value);
    if (!f) return false;
    const shown = f.charAt(0).toUpperCase() + f.slice(1);
    const label = splitFormat(f) ? f : shown;
    custom.add(label);
    sel.add(label);
    customEl.value = '';
    drawFormats();
    return true;
  }

  nameEl.addEventListener('input', () => { errEl.textContent = ''; msgEl.textContent = ''; drawSuggestions(); drawFormats(); });
  customEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } });
  wrap.addEventListener('click', (e) => {
    const f = e.target.closest('.fmt[data-fmt]');
    if (f && !f.disabled) { const v = f.dataset.fmt; if (sel.has(v)) sel.delete(v); else sel.add(v); errEl.textContent = ''; msgEl.textContent = ''; buzz(); drawFormats(); return; }
    const s = e.target.closest('.chip[data-name]');
    if (s) { nameEl.value = s.dataset.name; errEl.textContent = ''; const bd = $$('.cbrowse'); if (bd) bd.open = false; drawSuggestions(); drawFormats(); return; }
    if (e.target.closest('#rAdd')) { addCustom(); customEl.focus(); return; }
    if (e.target.closest('#rAll')) { showAll = true; drawFormats(); }
  });
  const del = $$('#rDel');
  if (del) del.addEventListener('click', () => {
    const undo = snapshot();
    const gone = new Set(group.items);
    c.items = c.items.filter((i) => !gone.has(i));
    c.dnDate = today();
    save();
    finish('Référence supprimée', undo);
  });

  $$('#sheetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (customEl.value.trim()) addCustom();
    const again = !!(e.submitter && e.submitter.dataset.again);
    const name = cleanName(nameEl.value);
    if (!name) { errEl.textContent = 'Écris le nom de la référence.'; nameEl.focus(); return; }
    if (!sel.size) { errEl.textContent = group ? 'Choisis au moins un format, ou supprime la référence.' : 'Choisis au moins un format.'; return; }
    const key2 = nameKey(name);
    let added = 0;
    if (group) {
      const olds = group.items;
      c.items = c.items.filter((i) => !(olds.includes(i) && !sel.has(i.format)));
      olds.forEach((i) => { i.name = name; });
      for (const f of sel) if (!olds.some((i) => i.format === f)) { c.items.push({ id: uid(), name, format: f, accepted: false }); added++; }
    } else {
      const existing = c.items.filter((i) => nameKey(i.name) === key2);
      const canon = existing.length ? existing[0].name : name;
      const have = new Set(existing.map((i) => i.format));
      for (const f of sel) if (!have.has(f)) { c.items.push({ id: uid(), name: canon, format: f, accepted: false }); added++; }
      if (!added) { errEl.textContent = 'Ces formats sont déjà dans la liste.'; return; }
    }
    dedupeItems(c);
    c.dnDate = today();
    c.demo = false;
    save();
    if (again) {
      const done = [...sel].sort(cmpFormat).join(', ');
      sel.clear(); custom.clear();
      nameEl.value = ''; errEl.textContent = '';
      msgEl.className = 'msg';
      msgEl.textContent = `Ajouté : ${name} (${done}). Tu peux en saisir une autre.`;
      render({ keepScroll: true });
      drawSuggestions(); drawFormats();
      nameEl.focus();
    } else {
      finish(group ? 'Référence modifiée' : added > 1 ? `${added} formats ajoutés` : 'Référence ajoutée');
    }
  });
  drawSuggestions();
  drawFormats();
}

/* Pas deux fois le même nom et le même format pour un magasin. */
function dedupeItems(c) {
  const seen = new Map();
  const out = [];
  for (const it of c.items) {
    const k = nameKey(it.name) + '|' + it.format;
    if (seen.has(k)) { if (it.accepted) seen.get(k).accepted = true; continue; }
    seen.set(k, it);
    out.push(it);
  }
  c.items = out;
}

/* Noms de références proposés à la saisie : les plus utilisés, puis le catalogue collé dans les réglages. */
function allRefNames() {
  const seen = new Set();
  const out = [];
  [...nameCatalogue(), ...state.catalogue, ...activeProductNames()].forEach((n) => { const k = nameKey(n); if (k && !seen.has(k)) { seen.add(k); out.push(n); } });
  return out;
}

/* ══════════ Réglages, sauvegarde, exemple ══════════ */
/* Renvoie 'downloaded' (Android, ordinateur), 'shared' (iPhone : feuille Partager) ou 'cancelled' (feuille fermée sans rien choisir). */
async function exportBackup() {
  const prev = state.lastBackup;
  state.lastBackup = Date.now();
  const json = JSON.stringify({ app: 'tournee', exportedAt: new Date().toISOString(), ...state }, null, 1);
  let r;
  try { r = await saveFile(`tournee-sauvegarde-${today()}.json`, json, 'application/json'); } catch (e) { state.lastBackup = prev; throw e; }
  if (r === 'cancelled') { state.lastBackup = prev; return r; }
  save(false);
  return r;
}

/* ══════════ Visites : objectif annuel, retard, suivi global ══════════
   La classification du client donne son objectif : F10 = 10 visites par an, F8 = 8, F6 = 6, F4 = 4, F2 = 2,
   N8 = nouveau client à voir 8 fois, F0 = hors programme. Le compteur est modifiable à la main. */

const PARC = [];   /* liste des clients (numéro, nom, adresse, classification, position) : remplacée à l'assemblage */
const CLS_ORDER = ['F10', 'F8', 'N8', 'F6', 'F4', 'F2', 'F0'];
const ST_LABEL = { bad: 'Très en retard', late: 'En retard', soon: 'À planifier', ok: 'À jour', full: 'Objectif atteint', none: 'Hors programme' };
const ui = { fl: { st: 'all', cls: [], dep: '' }, sort: 'gap', q: '', sel: [], selMode: false, quick: false, mapF: false, todo: 'all' };
const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;

/* Champs « visites » d'un client, remis en état à chaque chargement (appelé par sanitize). */
function sanitizeVisitFields(c) {
  const str = (x) => (typeof x === 'string' ? x : x == null ? '' : String(x));
  const gn = (x) => (x === null || x === '' || x === undefined || !Number.isFinite(+x) ? null : +x);
  const vis = {};
  if (c.vis && typeof c.vis === 'object') {
    for (const [y, n] of Object.entries(c.vis)) { const k = +y, v = Math.floor(+n); if (k >= 2000 && k <= 2100 && v > 0) vis[k] = Math.min(v, 999); }
  }
  const task = (t) => ({ id: str(t && t.id) || uid(), label: cleanName(str(t && t.label)), done: !!(t && t.done), from: ISO_RE.test(str(t && t.from)) ? str(t.from) : '', due: ISO_RE.test(str(t && t.due)) ? str(t.due) : '' });
  const tasks = (a) => (Array.isArray(a) ? a : []).map(task).filter((t) => t.label);
  /* Responsables du magasin : 2 au plus, responsable de rayon ou de magasin. */
  const person = (p) => {
    const off = cleanOff(p && p.off);
    return { id: str(p && p.id) || uid(), name: cleanName(str(p && p.name)).slice(0, 60), role: p && p.role === 'magasin' ? 'magasin' : 'rayon', off, half: cleanHalf(p && p.half, off) };
  };
  const people = (a) => (Array.isArray(a) ? a : []).map(person).filter((p) => p.name).slice(0, 2);
  return {
    num: str(c.num), street: str(c.street), zip: str(c.zip), phone: str(c.phone).replace(/\D/g, ''),
    cls: /^[FN]\d{1,2}$/.test(str(c.cls)) ? str(c.cls) : '',
    lat: gn(c.lat), lon: gn(c.lon), geo: c.geo === 'x' || c.geo === 'c' ? c.geo : '',
    vis, lastVisit: ISO_RE.test(str(c.lastVisit)) ? str(c.lastVisit) : '',
    goal: str(c.goal), vnotes: str(c.vnotes), tasks: tasks(c.tasks), contacts: people(c.contacts),
    history: (Array.isArray(c.history) ? c.history : []).filter((h) => h && ISO_RE.test(str(h.date)))
      .map((h) => ({ id: str(h.id) || uid(), date: str(h.date), goal: str(h.goal), notes: str(h.notes), tasks: tasks(h.tasks) }))
      .sort((a, b) => a.date.localeCompare(b.date)),
    reprises: (Array.isArray(c.reprises) ? c.reprises : []).filter((r) => r && ISO_RE.test(str(r.date)))
      .map((r) => ({ id: str(r.id) || uid(), date: str(r.date), n: Math.min(99, Math.max(1, Math.floor(+r.n) || 1)), amt: Math.min(9999999, Math.max(0, Math.round((+r.amt || 0) * 100) / 100)), note: str(r.note).slice(0, 160) }))
      .sort((a, b) => a.date.localeCompare(b.date)),
  };
}

/* ───── objectif, compteur, retard ───── */
const targetOf = (c) => { const m = /^[FN](\d+)$/.exec(c.cls || ''); return m ? +m[1] : 0; };
const curYear = () => new Date().getFullYear();
const visitsOf = (c, y = curYear()) => (c.vis && c.vis[y]) || 0;
const yearFrac = (d = new Date()) => { const y = d.getFullYear(); return (d - new Date(y, 0, 1)) / (new Date(y + 1, 0, 1) - new Date(y, 0, 1)); };

/* Retard = visites attendues à ce jour (objectif × part de l'année écoulée) moins visites faites. */
function visitStatus(c) {
  const t = targetOf(c), done = visitsOf(c);
  if (!t) return { kind: 'none', t: 0, done, exp: 0, gap: 0 };
  const exp = t * yearFrac(), gap = exp - done, st = state.settings;
  let kind = 'ok';
  if (done >= t) kind = 'full';
  else if (gap >= st.bad) kind = 'bad';
  else if (gap >= st.warn) kind = 'late';
  else if (gap >= st.warn / 2) kind = 'soon';
  return { kind, t, done, exp, gap };
}
function setVisits(c, n, y = curYear()) {
  n = Math.max(0, Math.min(999, Math.floor(+n) || 0));
  const v = { ...c.vis };
  if (n) v[y] = n; else delete v[y];
  c.vis = v;
}
function agoLong(iso) {
  const n = diffDays(iso, today());
  if (n <= 0) return "aujourd'hui";
  if (n === 1) return 'hier';
  if (n < 14) return `il y a ${n} jours`;
  if (n < 60) return `il y a ${Math.round(n / 7)} semaines`;
  return `il y a ${Math.round(n / 30.4)} mois`;
}
/* Date à laquelle la prochaine visite doit être faite pour tenir l'objectif de l'année. */
function dueDate(c) {
  const t = targetOf(c), done = visitsOf(c), y = curYear();
  if (!t || done >= t) return '';
  const a = new Date(y, 0, 1), b = new Date(y + 1, 0, 1);
  return isoDate(new Date(a.getTime() + ((done + 1) / t) * (b - a)));
}

/* ───── libellés ───── */
const SMALL_WORDS = new Set(['de', 'des', 'du', 'la', 'le', 'les', 'sur', 'sous', 'et', 'aux', 'en', 'l', 'd']);
function prettyCity(s) {
  return String(s || '').toLowerCase().replace(/[^\s'-]+/g, (w, i) => (i > 0 && SMALL_WORDS.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)));
}
const fmtPhone = (d) => String(d || '').replace(/(\d{2})(?=\d)/g, '$1 ').trim();
const telHref = (d) => (/^0\d{9}$/.test(d) ? 'tel:+33' + d.slice(1) : 'tel:' + d);
const deptOf = (c) => String(c.zip || '').slice(0, 2);
const contactNames = (c) => (c.contacts || []).map((p) => p.name).join(' ');
const placeLine = (c) => [c.street, [c.zip, prettyCity(c.city)].filter(Boolean).join(' ')].filter(Boolean).join(', ');
const kindGroup = (k) => (k === 'bad' || k === 'late' ? 'late' : k === 'soon' ? 'soon' : k === 'ok' || k === 'full' ? 'ok' : 'none');

/* ───── import du parc clients (liste intégrée à l'appli) ───── */
/* Nombre de choses saisies à la main (le parc importé ne compte pas) : sert à rappeler la sauvegarde. */
function userEntries() {
  let n = state.promos.filter((p) => !p.demo).length + state.perso.length;
  for (const c of state.clients) {
    if (c.demo) continue;
    n += c.items.length + c.tasks.length + c.history.length + (c.goal ? 1 : 0) + (c.vnotes ? 1 : 0) + (c.notes ? 1 : 0) + (c.dnDate ? 1 : 0) + (c.rdvDate ? 1 : 0)
      + Object.values(c.vis).reduce((a, b) => a + b, 0) + c.reprises.length + c.contacts.length;
  }
  return n;
}
function newClientFromParc(p) {
  return { id: uid(), name: p.nm, city: prettyCity(p.ci), centraleId: '', rdvDate: '', rdvTime: '', notes: '', dnDate: null, demo: false, items: [], subs: [],
    num: p.n, street: p.st, zip: p.zp, phone: p.tl, cls: p.cl, lat: p.la, lon: p.lo, geo: p.g, vis: {}, lastVisit: '', goal: '', vnotes: '', tasks: [], contacts: [], history: [], reprises: [] };
}
/* Ajoute les clients absents et complète les fiches déjà présentes, sans rien écraser de ce qui a été saisi. */
function importParc() {
  if (state.clients.some((c) => c.demo)) {
    state.clients = state.clients.filter((c) => !c.demo);
    state.centrales = state.centrales.filter((x) => !x.demo);
    state.promos = state.promos.filter((p) => !p.demo);
  }
  const byNum = new Map(state.clients.filter((c) => c.num).map((c) => [c.num, c]));
  const byKey = new Map(state.clients.map((c) => [nameKey(c.name), c]));
  let added = 0, linked = 0;
  for (const p of PARC) {
    const c = byNum.get(p.n) || byKey.get(nameKey(p.nm));
    if (!c) { state.clients.push(newClientFromParc(p)); added++; continue; }
    linked++;
    if (!c.num) c.num = p.n;
    if (!c.street) c.street = p.st;
    if (!c.zip) c.zip = p.zp;
    if (!c.phone) c.phone = p.tl;
    if (!c.cls) c.cls = p.cl;
    if (c.lat == null) { c.lat = p.la; c.lon = p.lo; c.geo = p.g; }
  }
  state.parcDone = true; state.seeded = true;
  save();
  return { added, linked };
}

/* ───── vue « Suivi » ───── */
/* Filtres : classe (une ou plusieurs), département, recherche, état de retard. */
const segKey = (c) => c.cls || '-';   /* « - » = client non classé */
const segName = (k) => (k === '-' ? 'Non classé' : k);
const matchCls = (c) => !ui.fl.cls.length || ui.fl.cls.includes(segKey(c));
const matchDep = (c) => !ui.fl.dep || deptOf(c) === ui.fl.dep;
const matchQ = (c) => !(ui.q && view.name === 'suivi') || fold([c.name, c.city, c.num, c.zip, contactNames(c)].join(' ')).includes(fold(ui.q));
const matchSt = (c) => ui.fl.st === 'all' || kindGroup(visitStatus(c).kind) === ui.fl.st;
const matchBase = (c) => matchCls(c) && matchDep(c) && matchQ(c);
const matchAll = (c) => matchBase(c) && matchSt(c);
const matchSeg = (c) => matchDep(c) && matchQ(c) && matchSt(c);   /* tout sauf la classe : sert à compter chaque segment */

function sortClients(list) {
  const st = new Map(list.map((c) => [c.id, visitStatus(c)]));
  const last = (a, b) => (a.lastVisit || '').localeCompare(b.lastVisit || '') || byName(a, b);
  const sorts = {
    gap: (a, b) => { const A = st.get(a.id), B = st.get(b.id); if (!A.t !== !B.t) return A.t ? -1 : 1; return B.gap - A.gap || last(a, b); },
    due: (a, b) => (dueDate(a) || '9999').localeCompare(dueDate(b) || '9999') || byName(a, b),
    rep: (a, b) => repStats(b, curYear()).sum - repStats(a, curYear()).sum || repStats(b).sum - repStats(a).sum || byName(a, b),
    last, name: byName, city: (a, b) => a.city.localeCompare(b.city, 'fr') || byName(a, b),
  };
  return list.slice().sort(sorts[ui.sort] || sorts.gap);
}

function vrow(c) {
  const s = visitStatus(c), col = state.settings.color;
  const pos = ui.selMode ? ui.sel.indexOf(c.id) : -1;
  const pct = s.t ? Math.min(100, (s.done / s.t) * 100) : 0, ex = s.t ? Math.min(100, (s.exp / s.t) * 100) : 0;
  const sub = [prettyCity(c.city), c.cls, c.lastVisit ? agoLong(c.lastVisit) : '', ui.sort === 'rep' ? repShort(c) : ''].filter(Boolean).join(' · ');
  const label = `${c.name}, ${s.t ? `${s.done} visites sur ${s.t}` : `${s.done} visites`}, ${ST_LABEL[s.kind]}`;
  return `<button class="vrow${ui.selMode ? ' pick' : ''}"${col ? ` data-k="${s.kind}"` : ''} data-act="${ui.selMode ? 'sel-toggle' : 'open-client'}" data-id="${c.id}" data-fid="v${c.id}" aria-label="${esc(label)}"${ui.selMode ? ` aria-pressed="${pos >= 0}"` : ''}>
    ${ui.selMode ? `<span class="chk${pos >= 0 ? ' on' : ''}">${pos >= 0 ? pos + 1 : ''}</span>` : ''}
    <span class="vmain"><span class="client-name">${esc(c.name)}</span><span class="client-sub">${esc(sub)}</span>${s.t ? `<span class="vbar"><i style="width:${pct}%"></i><u style="left:${ex}%"></u></span>` : ''}</span>
    <span class="vcount"><b>${s.done}</b><small>${s.t ? '/ ' + s.t : 'visites'}</small>${col ? `<em>${ST_LABEL[s.kind]}</em>` : ''}</span>
  </button>`;
}

const FL_ST = { late: 'En retard', soon: 'À planifier', ok: 'À jour', none: 'Hors programme' };
const selOpt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`;
function depSelect() {
  const deps = [...new Set(state.clients.map(deptOf).filter(Boolean))].sort();
  return `<label class="sel"><span class="sr">Département</span><select data-on="fl-dep">${selOpt('', 'Tous dép.', ui.fl.dep)}${deps.map((d) => selOpt(d, d, ui.fl.dep)).join('')}</select></label>`;
}

/* Segments présents dans le parc : F10 → F0, puis les classes inattendues, puis « non classé ». */
function segList() {
  const have = new Set(state.clients.map(segKey));
  return [...CLS_ORDER.filter((k) => have.has(k)), ...[...have].filter((k) => k !== '-' && !CLS_ORDER.includes(k)).sort(), ...(have.has('-') ? ['-'] : [])];
}
/* Un segment filtré qui n'existe plus dans le parc (client reclassé) est oublié : jamais de filtre fantôme. */
function pruneSeg() {
  const l = segList();
  if (ui.fl.cls.some((k) => !l.includes(k))) ui.fl.cls = ui.fl.cls.filter((k) => l.includes(k));
}
const segMode = () => state.settings.mapColor !== 'late';
/* Couleur d'un client sur la carte et dans la recherche de tournée : son segment, ou son retard de visite. */
function colAttr(c) {
  if (segMode()) return ` data-s="${esc(segKey(c))}"`;
  return state.settings.color ? ` data-k="${visitStatus(c).kind}"` : '';
}

/* Puces « état de visite » : Tous / En retard / À planifier / À jour / Hors programme. */
function statusChips() {
  pruneSeg();
  const pool = state.clients.filter((c) => matchBase(c));
  const n = { all: pool.length, late: 0, soon: 0, ok: 0, none: 0 };
  pool.forEach((c) => { n[kindGroup(visitStatus(c).kind)]++; });
  const col = state.settings.color;
  const chip = (id, label, k) => `<button class="chip${ui.fl.st === id ? ' on' : ''}"${col && k ? ` data-k="${k}"` : ''} data-act="fl-st" data-v="${id}" aria-pressed="${ui.fl.st === id}">${label}<b>${n[id]}</b></button>`;
  return `<div class="chips fl">${chip('all', 'Tous')}${chip('late', FL_ST.late, 'late')}${chip('soon', FL_ST.soon, 'soon')}${chip('ok', FL_ST.ok, 'ok')}${chip('none', FL_ST.none, 'none')}</div>`;
}

/* Puces « segment » = légende de la carte. Un appui isole un segment, d'autres appuis en ajoutent, « Tous » remet tout. */
function segChipsHTML() {
  pruneSeg();
  const pool = state.clients.filter(matchSeg), n = {};
  pool.forEach((c) => { const k = segKey(c); n[k] = (n[k] || 0) + 1; });
  const cur = ui.fl.cls;
  const chip = (id, label, s, count, on) => `<button class="chip${on ? ' on' : ''}"${s ? ` data-s="${esc(s)}"` : ''} data-act="fl-seg" data-v="${esc(id)}" aria-pressed="${on}">${esc(label)}<b>${count}</b></button>`;
  return `<div class="chips fl" role="group" aria-label="Segments">${chip('__all', 'Tous', '', pool.length, !cur.length)}${segList().map((k) => chip(k, segName(k), k, n[k] || 0, cur.includes(k))).join('')}</div>`;
}

function suiviTop(withSelects = true) {
  const chips = statusChips();   /* oublie d'abord un segment disparu */
  const cl = ui.fl.cls, cv = cl.length > 1 ? '*' : cl[0] || '';
  return chips + (withSelects ? `<div class="filters">
    <label class="sel"><span class="sr">Classification</span><select data-on="fl-cls">${selOpt('', 'Classes', cv)}${cl.length > 1 ? selOpt('*', cl.map(segName).join(' + '), cv) : ''}${segList().map((k) => selOpt(k, segName(k), cv)).join('')}</select></label>
    ${depSelect()}
    <label class="sel"><span class="sr">Tri</span><select data-on="sort">${selOpt('gap', 'Plus en retard', ui.sort)}${selOpt('due', 'Échéance', ui.sort)}${selOpt('last', 'Dernière visite', ui.sort)}${selOpt('rep', 'Reprises (€)', ui.sort)}${selOpt('name', 'Nom', ui.sort)}${selOpt('city', 'Ville', ui.sort)}</select></label>
  </div>` : '');
}

/* Remplace une zone de filtres en gardant la rangée de puces là où le doigt l'avait glissée. */
function setTop(el, html) {
  const r = el.querySelector('.chips.fl'), x = r ? r.scrollLeft : 0;
  el.innerHTML = html;
  const n = x ? el.querySelector('.chips.fl') : null;
  if (n) n.scrollLeft = x;
}

function suiviList() {
  const list = sortClients(state.clients.filter((c) => matchAll(c)));
  if (!list.length) return emptyBox('Aucun client ne correspond à ces filtres.', `<button class="btn small" data-act="fl-reset">Tout afficher</button>`);
  return `<div class="group"><h2>${plural(list.length, 'client', 'clients')}</h2></div>${ui.quick ? `<p class="hint">Tape le nombre de visites faites en ${curYear()} (ou − et +). « Suivant » passe au client d'après. Astuce : trie par Nom ou Ville.</p>` : ''}${list.map(ui.quick ? vrowQuick : vrow).join('')}`;
}

function selBar(flow = false) {
  if (!ui.selMode) return '';
  const n = ui.sel.length;
  return `<div class="selbar${flow ? ' flow' : ''}"><span>${n ? plural(n, 'client choisi', 'clients choisis') : 'Touche des clients pour composer la tournée'}</span>${n ? `<button class="btn small" data-act="sel-clear">Vider</button><button class="btn small primary" data-act="sel-plan">${icon('cal')}Planifier</button>` : ''}</div>`;
}

function vsumHTML() {
  const tot = state.clients.reduce((a, c) => {
    const t = targetOf(c);
    return t ? { done: a.done + visitsOf(c), exp: a.exp + t * yearFrac(), goal: a.goal + t } : a;
  }, { done: 0, exp: 0, goal: 0 });
  const rt = repTotals();
  return `<b>${tot.done}</b> visites faites · <b>${Math.round(tot.exp)}</b> attendues à ce jour · <b>${tot.goal}</b> prévues sur l'année${rt.n ? `<br>Reprises de périmés ${curYear()} : <b>${rt.n}</b> · <b>${fmtEur(rt.sum)}</b>` : ''}`;
}
function viewSuivi() {
  return `<header class="top"><div><p class="date">${curYear()} · ${Math.round(yearFrac() * 100)} % de l'année écoulée</p><h1 class="title">Suivi</h1></div>
      <button class="btn small ghost" data-act="open-settings">${icon('sliders')}Réglages</button></header>
    <p class="vsum" id="vsum">${vsumHTML()}</p>
    <div class="search">${icon('search')}<input id="vq" type="search" placeholder="Chercher un client, une ville" autocomplete="off" enterkeyhint="search" aria-label="Chercher un client"></div>
    <div id="vtop">${suiviTop()}</div>
    <div class="vtools"><button class="btn small${ui.selMode ? ' primary' : ''}" data-act="sel-mode">${icon('route')}${ui.selMode ? 'Terminer la sélection' : 'Préparer une tournée'}</button><button class="btn small${ui.quick ? ' primary' : ''}" data-act="q-mode">${icon('pencil')}${ui.quick ? 'Terminer la saisie' : 'Saisir les compteurs'}</button></div>
    <div id="vlist">${suiviList()}</div>${selBar()}`;
}

function refreshSuivi() {
  if (view.name === 'suivi') {
    const a = $('#vtop'), b = $('#vlist');
    if (a) setTop(a, suiviTop());
    if (b) b.innerHTML = suiviList();
  } else if (view.name === 'carte') mapRefresh(true);
}

/* ───── branchements (clics, saisies, changements) ───── */
ACTIONS_X['fl-st'] = (t) => { ui.fl.st = t.dataset.v; refreshSuivi(); };
ACTIONS_X['fl-seg'] = (t) => {
  const k = t.dataset.v, cur = ui.fl.cls;
  ui.fl.cls = k === '__all' ? [] : cur.includes(k) ? cur.filter((x) => x !== k) : [...cur, k];
  if (ui.fl.cls.length >= segList().length) ui.fl.cls = [];   /* tous les segments cochés = aucun filtre */
  refreshSuivi();
};
ACTIONS_X['fl-reset'] = () => { ui.fl = { st: 'all', cls: [], dep: '' }; ui.q = ''; render({ keepScroll: true }); };
ON_CHANGE['fl-cls'] = (el) => { if (el.value !== '*') ui.fl.cls = el.value ? [el.value] : []; refreshSuivi(); };
ON_CHANGE['fl-dep'] = (el) => { ui.fl.dep = el.value; refreshSuivi(); };
ON_CHANGE.sort = (el) => { ui.sort = el.value; refreshSuivi(); };
ON_INPUT.vq = (el) => { ui.q = el.value; refreshSuivi(); };

ACTIONS_X['sel-mode'] = () => { ui.selMode = !ui.selMode; if (!ui.selMode) ui.sel = []; else ui.quick = false; render({ keepScroll: true }); };
ACTIONS_X['sel-toggle'] = (t) => toggleSel(t.dataset.id);
ACTIONS_X['sel-clear'] = () => { ui.sel = []; render({ keepScroll: true }); };
function toggleSel(id) {
  const i = ui.sel.indexOf(id);
  if (i >= 0) ui.sel.splice(i, 1); else ui.sel.push(id);
  buzz();
  if (view.name === 'carte') mapRefresh(); else render({ keepScroll: true });
}

AFTER.push(() => {
  if (view.name === 'suivi') { const q = $('#vq'); if (q) q.value = ui.q; }
});

/* ───── réglages du suivi et de la tournée ───── */
const numIn = (el, def) => { const n = parseFloat(String(el.value).replace(',', '.')); return Number.isFinite(n) ? n : def; };
ON_CHANGE['set-color'] = (el) => { state.settings.color = el.checked; save(); render({ keepScroll: true }); };
ON_CHANGE['set-warn'] = (el) => {
  const st = state.settings; st.warn = Math.min(6, Math.max(0.5, numIn(el, st.warn)));
  if (st.bad < st.warn) st.bad = st.warn;
  el.value = st.warn; const b = $('#sBad'); if (b) b.value = st.bad;
  save(); render({ keepScroll: true });
};
ON_CHANGE['set-bad'] = (el) => {
  const st = state.settings; st.bad = Math.min(8, Math.max(st.warn, numIn(el, st.bad)));
  el.value = st.bad; save(); render({ keepScroll: true });
};
ON_CHANGE['set-start'] = (el) => { if (/^\d{2}:\d{2}$/.test(el.value)) { state.settings.tourStart = el.value; save(); } };
ON_CHANGE['set-gap'] = (el) => { state.settings.tourGap = Math.min(480, Math.max(15, Math.round(numIn(el, state.settings.tourGap)))); el.value = state.settings.tourGap; save(); };

/* ───── saisie rapide des compteurs (liste Suivi) ───── */
function vrowQuick(c) {
  const s = visitStatus(c), col = state.settings.color;
  const sub = [prettyCity(c.city), c.cls].filter(Boolean).join(' · ');
  const bar = s.t ? `<span class="vbar"><i style="width:${Math.min(100, (s.done / s.t) * 100)}%"></i><u style="left:${Math.min(100, (s.exp / s.t) * 100)}%"></u></span>` : '';
  return `<div class="vrow quick" data-rid="${c.id}"${col ? ` data-k="${s.kind}"` : ''}>
    <button class="vmain" data-act="open-client" data-id="${c.id}"><span class="client-name">${esc(c.name)}</span><span class="client-sub">${esc(sub)}</span>${bar}</button>
    <div class="vstep">
      <button class="step sm" data-act="q-dec" data-id="${c.id}" aria-label="Retirer une visite à ${esc(c.name)}"${s.done ? '' : ' disabled'}>${icon('minus')}</button>
      <span class="qn"><input class="qnum" type="number" inputmode="numeric" min="0" max="999" value="${s.done}" data-on="q-set" data-id="${c.id}" enterkeyhint="next" aria-label="Visites de ${esc(c.name)} en ${curYear()}"><small>${s.t ? '/ ' + s.t : 'visites'}</small></span>
      <button class="step sm" data-act="q-inc" data-id="${c.id}" aria-label="Ajouter une visite à ${esc(c.name)}">${icon('plus')}</button>
    </div>
  </div>`;
}
/* On met la ligne à jour sur place, sans retrier la liste : elle ne bouge pas pendant la saisie. */
function qPaint(row, c) {
  if (!row) return;
  const s = visitStatus(c);
  if (state.settings.color) row.dataset.k = s.kind; else delete row.dataset.k;
  const inp = $('.qnum', row); if (inp) inp.value = s.done;
  const dec = $('[data-act="q-dec"]', row); if (dec) dec.disabled = !s.done;
  const i = $('.vbar i', row), u = $('.vbar u', row);
  if (i && s.t) i.style.width = Math.min(100, (s.done / s.t) * 100) + '%';
  if (u && s.t) u.style.left = Math.min(100, (s.exp / s.t) * 100) + '%';
}
function qTop() {
  const a = $('#vtop');
  if (a) { const sc = $('.chips', a), x = sc ? sc.scrollLeft : 0; a.innerHTML = suiviTop(); const n = $('.chips', a); if (n) n.scrollLeft = x; }
  const m = $('#vsum'); if (m) m.innerHTML = vsumHTML();
}
function qBump(id, d) {
  const c = getClient(id); if (!c) return;
  setVisits(c, visitsOf(c) + d); save(); buzz();
  qPaint($(`#vlist [data-rid="${id}"]`), c); qTop();
}
ACTIONS_X['q-mode'] = () => { ui.quick = !ui.quick; if (ui.quick) { ui.selMode = false; ui.sel = []; } render({ keepScroll: true }); };
ACTIONS_X['q-inc'] = (t) => qBump(t.dataset.id, 1);
ACTIONS_X['q-dec'] = (t) => qBump(t.dataset.id, -1);
ON_CHANGE['q-set'] = (el) => {
  const c = getClient(el.dataset.id); if (!c) return;
  setVisits(c, el.value); save();
  qPaint(el.closest('.vrow'), c); qTop();
};


/* ══════════ Fiche magasin : compteur de visites, objectif, notes et tâches ══════════ */
let saveTimer = 0;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = 0; save(); }, 350); }
function flushSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = 0; save(); } }
const curClient = () => (view.name === 'client' ? getClient(view.id) : null);
const nl2br = (s) => esc(s).replace(/\n/g, '<br>');
const fmtNum = (n) => String(Math.round(n * 10) / 10).replace('.', ',');
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 420) + 'px'; }

/* Ouvrir Maps (ou l'appli de navigation) sur l'adresse : fonctionne hors connexion tant que l'appli a ses cartes. */
function geoHref(c) {
  const q = [c.street, c.zip, prettyCity(c.city)].filter(Boolean).join(' ');
  if (IOS) {   /* « geo: » n'existe pas sur iPhone : on ouvre Plans */
    if (q) return 'https://maps.apple.com/?daddr=' + encodeURIComponent(q) + '&dirflg=d';
    return c.lat != null && c.lon != null ? `https://maps.apple.com/?daddr=${c.lat},${c.lon}&dirflg=d` : '';
  }
  if (c.street && q) return 'geo:0,0?q=' + encodeURIComponent(q);
  if (c.lat != null && c.lon != null) return `geo:${c.lat},${c.lon}?q=${c.lat},${c.lon}(${encodeURIComponent(c.name)})`;
  return q ? 'geo:0,0?q=' + encodeURIComponent(q) : '';
}
function contactHTML(c) {
  const geo = geoHref(c), acts = [];
  if (c.phone) acts.push(`<a class="btn small" href="${esc(telHref(c.phone))}">${icon('phone')}${esc(fmtPhone(c.phone))}</a>`);
  if (geo) acts.push(`<a class="btn small" href="${esc(geo)}">${icon('pin')}Y aller</a>`);
  return acts.length ? `<div class="contact">${acts.join('')}</div>` : '';
}

/* ───── responsables du magasin : 1 ou 2 personnes, responsable de rayon ou de magasin ───── */
const ROLE_LABEL = { rayon: 'Responsable de rayon', magasin: 'Responsable de magasin' };
const initialsOf = (n) => cleanName(n).split(' ').filter(Boolean).slice(0, 2).map((w) => Array.from(w)[0].toUpperCase()).join('');
function peopleHTML(c) {
  const rows = c.contacts.map((p) => `<button class="person" data-act="edit-person" data-pid="${p.id}" data-fid="ct${p.id}" aria-label="${esc(p.name)}, ${ROLE_LABEL[p.role]}${hasRest(p) ? ', ' + esc(restSentence(p)) : ''} : modifier"><span class="av ${p.role}" aria-hidden="true">${esc(initialsOf(p.name))}</span><span class="pn"><b>${esc(p.name)}</b><small>${ROLE_LABEL[p.role]}</small>${offsHTML(p)}</span>${icon('pencil')}</button>`).join('');
  const add = c.contacts.length < 2
    ? `<button class="btn small ghost addp" data-act="add-person" data-fid="ctadd">${icon('plus')}${c.contacts.length ? 'Ajouter un second responsable' : 'Ajouter un responsable'}</button>`
    : '';
  return `<div class="people" role="group" aria-label="Responsables du magasin">${rows}${add}</div>`;
}
function openPersonSheet(c, pid) {
  const p = pid ? c.contacts.find((x) => x.id === pid) : null;
  if (pid && !p) return;
  if (!p && c.contacts.length >= 2) return;
  const role = p ? p.role : (c.contacts.length && c.contacts[0].role === 'rayon' ? 'magasin' : 'rayon');
  const offs = new Set(p ? offOf(p) : []);
  let half = p && halfOf(p) ? { d: halfOf(p).d, p: halfOf(p).p } : null;
  const days = (attr) => WEEK.map((d) => `<button type="button" class="wd" data-${attr}="${d}" aria-pressed="false" aria-label="${WD[d]}">${WD3[d]}</button>`).join('');
  const wrap = openSheet({
    title: p ? 'Modifier le responsable' : 'Ajouter un responsable',
    focus: p ? null : '#pName',
    body: `<form id="sheetForm" class="form" novalidate autocomplete="off">
      <p class="lead">${esc(c.name)}</p>
      ${field('pName', 'Nom (et prénom)', `<input id="pName" type="text" value="${esc(p ? p.name : '')}" maxlength="60" autocapitalize="words" enterkeyhint="done" placeholder="Ex. Sophie Martin">`)}
      <fieldset class="roles"><legend>Fonction</legend>${['rayon', 'magasin'].map((k) => `<label class="role"><input type="radio" name="pRole" value="${k}"${k === role ? ' checked' : ''}><span>${ROLE_LABEL[k]}</span></label>`).join('')}</fieldset>
      <fieldset class="rest"><legend>Jour de repos fixe</legend>
        <div class="wdays" role="group" aria-label="Jours de repos">${days('off')}</div>
        <p class="hint" id="pOffSum" role="status"></p>
      </fieldset>
      <fieldset class="rest"><legend>Demi-journée fixe en plus <span>(facultatif)</span></legend>
        <div class="wdays" role="group" aria-label="Jour de la demi-journée">${days('half')}</div>
        <div class="parts" role="group" aria-label="Matin ou après-midi"><button type="button" class="wd" data-part="am" aria-pressed="false">Matin</button><button type="button" class="wd" data-part="pm" aria-pressed="false">Après-midi</button></div>
        <p class="hint" id="pHalfSum" role="status"></p>
      </fieldset>
      <p class="err" id="pErr" role="alert"></p>
      ${p ? '<button type="button" class="link danger" id="pDel" style="align-self:flex-start">Retirer ce responsable</button>' : ''}
    </form>`,
    foot: `<button type="button" class="btn grow" data-act="sheet-close">Annuler</button><button type="submit" form="sheetForm" class="btn primary grow">${p ? 'Enregistrer' : 'Ajouter'}</button>`,
  });
  const $$ = (s) => $(s, wrap);
  const sync = () => {
    const cur = { off: WEEK.filter((d) => offs.has(d)), half };
    wrap.querySelectorAll('[data-off]').forEach((b) => b.setAttribute('aria-pressed', String(offs.has(+b.dataset.off))));
    wrap.querySelectorAll('[data-half]').forEach((b) => { const d = +b.dataset.half; b.setAttribute('aria-pressed', String(!!half && half.d === d)); b.disabled = offs.has(d); });
    wrap.querySelectorAll('[data-part]').forEach((b) => { b.setAttribute('aria-pressed', String(!!half && half.p === b.dataset.part)); b.disabled = !half; });
    $$('#pOffSum').textContent = cur.off.length ? `Repos : ${restDays(cur)}.` : 'Aucun jour de repos indiqué.';
    $$('#pHalfSum').textContent = half ? `Demi-journée : ${restHalf(cur)}.` : 'Aucune demi-journée.';
  };
  sync();
  $$('#sheetForm').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-off],button[data-half],button[data-part]');
    if (!b || b.disabled) return;
    $$('#pErr').textContent = '';
    if (b.dataset.off !== undefined) {
      const d = +b.dataset.off;
      if (offs.has(d)) offs.delete(d);
      else if (offs.size >= 6) { $$('#pErr').textContent = 'Une personne ne peut pas être en repos 7 jours sur 7.'; return; }
      else { offs.add(d); if (half && half.d === d) half = null; }
    } else if (b.dataset.half !== undefined) {
      const d = +b.dataset.half;
      half = half && half.d === d ? null : { d, p: half ? half.p : 'am' };
    } else if (half) half.p = b.dataset.part === 'pm' ? 'pm' : 'am';
    sync();
  });
  const del = $$('#pDel');
  if (del) del.addEventListener('click', () => {
    const undo = snapshot();
    c.contacts = c.contacts.filter((x) => x.id !== p.id); save();
    finish('Responsable retiré', undo);
  });
  $$('#sheetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = cleanName($$('#pName').value).slice(0, 60);
    if (!name) { $$('#pErr').textContent = 'Écris le nom du responsable.'; $$('#pName').focus(); return; }
    const r = $$('input[name="pRole"]:checked'), rk = r && r.value === 'magasin' ? 'magasin' : 'rayon';
    const off = WEEK.filter((d) => offs.has(d)), hf = half ? { d: half.d, p: half.p } : null;
    if (p) { p.name = name; p.role = rk; p.off = off; p.half = hf; } else c.contacts.push({ id: uid(), name, role: rk, off, half: hf });
    save();
    finish(p ? 'Responsable enregistré' : 'Responsable ajouté');
  });
}
ACTIONS_X['add-person'] = () => { const c = curClient(); if (c && c.contacts.length < 2) openPersonSheet(c, null); };
ACTIONS_X['edit-person'] = (t) => { const c = curClient(); if (c) openPersonSheet(c, t.dataset.pid); };

/* ───── visites ───── */
function visitVerdict(c, s) {
  if (!s.t) return c.cls === 'F0' ? "Pas d'objectif de visites pour ce client (F0)." : 'Pas de classification : choisis-la avec « Modifier ».';
  if (s.kind === 'full') return `Objectif de l'année atteint (${s.t} visites).`;
  const due = dueDate(c), late = diffDays(due, today());
  if (late > 0) return `La visite n° ${s.done + 1} aurait dû être faite avant le ${dayLabel(due)} (${plural(late, 'jour', 'jours')} de retard).`;
  return `La visite n° ${s.done + 1} est à faire avant le ${dayLabel(due)}.`;
}

function recapHTML(c) {
  const h = c.history[c.history.length - 1];
  if (!h) {
    if (!visitsOf(c) && !c.lastVisit) return '';
    return `<div class="prev"><div class="prev-head"><h3>Visite précédente</h3>${c.lastVisit ? `<span>${esc(dayLabel(c.lastVisit))}</span>` : ''}</div><p class="muted">Aucun compte rendu : ${plural(visitsOf(c), 'visite faite', 'visites faites')} avant l'appli ou sans notes.</p></div>`;
  }
  const still = (t) => c.tasks.some((x) => x.id === t.id && !x.done);
  const tasks = h.tasks.length
    ? `<p class="lbl">Tâches</p><ul class="tl">${h.tasks.map((t) => `<li class="${t.done ? 'done' : ''}"><span class="tick">${t.done ? icon('check') : ''}</span><span>${esc(t.label)}${!t.done && still(t) ? ' <em>toujours à faire</em>' : ''}</span></li>`).join('')}</ul>`
    : '';
  return `<div class="prev">
    <div class="prev-head"><h3>Visite précédente</h3><span>${esc(dayLabel(h.date))}</span></div>
    ${h.goal ? `<p class="lbl">Buts</p><p>${nl2br(h.goal)}</p>` : ''}
    ${h.notes ? `<p class="lbl">Notes</p><p>${nl2br(h.notes)}</p>` : ''}
    ${tasks}
    ${!h.goal && !h.notes && !h.tasks.length ? '<p class="muted">Aucun compte rendu pour cette visite.</p>' : ''}
    ${c.history.length > 1 ? `<button class="link" data-act="open-history">Toutes les visites (${c.history.length})</button>` : ''}
  </div>`;
}

function visitSection(c) {
  const s = visitStatus(c), y = curYear(), col = state.settings.color;
  const bar = s.t ? `<span class="vbar big"><i style="width:${Math.min(100, (s.done / s.t) * 100)}%"></i><u style="left:${Math.min(100, (s.exp / s.t) * 100)}%"></u></span><span class="vbar-cap"><span>${plural(s.done, 'faite', 'faites')}</span><span>attendues à ce jour : ${fmtNum(s.exp)}</span></span>` : '';
  return `<section class="sec" id="sec-visit">
    <div class="sec-head"><h2>Visites ${y}</h2></div>
    <div class="vcard"${col ? ` data-k="${s.kind}"` : ''}>
      <div class="vc-row">
        <button class="step" data-act="vis-dec" data-fid="vdec" aria-label="Retirer une visite"${s.done ? '' : ' disabled'}>${icon('minus')}</button>
        <label class="vc-num"><span class="sr">Visites faites en ${y}</span><input type="number" inputmode="numeric" min="0" max="999" value="${s.done}" data-on="vis-set" data-fid="vnum"><span class="of">${s.t ? `sur ${s.t}` : 'visites'}</span></label>
        <button class="step" data-act="vis-inc" data-fid="vinc" aria-label="Ajouter une visite">${icon('plus')}</button>
      </div>
      ${bar}
      <p class="vc-line"><b>${ST_LABEL[s.kind]}.</b> ${esc(visitVerdict(c, s))}</p>
      <div class="vc-last"><label for="lastV">Dernière visite</label><input id="lastV" type="date" value="${esc(c.lastVisit)}" max="${today()}" data-on="last-set" data-fid="lastv"></div>
      <p class="hint">Corrige le compteur avec − et +, ou touche le chiffre pour le saisir. « Terminer la visite » (en bas de fiche) l'augmente tout seul.</p>
    </div>
    ${recapHTML(c)}
  </section>`;
}

ON_CHANGE['last-set'] = (el) => { const c = curClient(); if (!c) return; c.lastVisit = ISO_RE.test(el.value) ? el.value : ''; save(); render({ keepScroll: true }); };

/* ───── notes et tâches ───── */
function taskHTML(t) {
  return `<li class="task${t.done ? ' done' : ''}">
    <button class="tk" data-act="task-toggle" data-tid="${t.id}" data-fid="t${t.id}" aria-pressed="${t.done}" aria-label="${esc(t.label)} : ${t.done ? 'faite' : 'à faire'}"><span class="box">${t.done ? icon('check') : ''}</span><span class="tt">${esc(t.label)}${t.from ? `<small>depuis le ${esc(dayLabel(t.from))}</small>` : ''}</span></button>
    <button class="icon-btn" data-act="task-del" data-tid="${t.id}" aria-label="Supprimer la tâche ${esc(t.label)}">${icon('x')}</button>
    ${dueChip(t)}
  </li>`;
}
function taskSugHTML(c, q) {
  const have = new Set(c.tasks.filter((t) => !t.done).map((t) => nameKey(t.label)));
  const fq = fold(q);
  const list = state.taskCat.filter((t) => !have.has(nameKey(t.label)) && (!fq || fold(t.label).includes(fq)))
    .sort((a, b) => b.n - a.n || a.label.localeCompare(b.label, 'fr')).slice(0, 14);
  if (!list.length) return state.taskCat.length ? '' : `<p class="hint">Les tâches que tu ajoutes seront proposées ici pour tous tes clients.</p>`;
  return list.map((t) => `<button type="button" class="chip" data-act="task-sug" data-label="${esc(t.label)}">${esc(t.label)}</button>`).join('');
}
function notesSection(c) {
  const open = c.tasks.filter((x) => !x.done).length;
  return `<section class="sec" id="sec-notes">
    <div class="sec-head"><h2>Après le RDV</h2></div>
    <div class="field"><label for="vnotes">Notes</label><textarea id="vnotes" class="grow" data-on="vnotes" placeholder="Ce qui a été dit ou décidé, la personne rencontrée…">${esc(c.vnotes)}</textarea></div>
    <h3 class="sub-h">Tâches à faire${c.tasks.length ? `<span class="n">${open}</span>` : ''}</h3>
    ${c.tasks.length ? `<ul class="tasks">${c.tasks.map(taskHTML).join('')}</ul>` : ''}
    <div class="row2 tadd"><input id="tNew" type="text" data-on="task-in" data-enter="task-add" data-fid="tnew" enterkeyhint="done" autocapitalize="sentences" placeholder="Nouvelle tâche" aria-label="Nouvelle tâche"><button class="btn small primary" data-act="task-add">Ajouter</button></div>
    <div class="chips scroll" id="tSug">${taskSugHTML(c, '')}</div>
    <div class="finish">
      <button class="btn primary" data-act="finish-visit">${icon('check')}Terminer la visite</button>
      <p class="hint">Range le compte rendu dans l'historique, ajoute 1 au compteur et reporte les tâches non faites.</p>
      ${c.history.length ? `<button class="link" data-act="open-history">Historique des visites (${c.history.length})</button>` : ''}
    </div>
  </section>`;
}

function addTask(c, raw) {
  const label = cleanName(raw);
  if (!label) return false;
  if (c.tasks.some((t) => !t.done && nameKey(t.label) === nameKey(label))) { toast('Cette tâche est déjà dans la liste'); return false; }
  c.tasks.push({ id: uid(), label, done: false, from: '', due: '' });
  const k = nameKey(label), e = state.taskCat.find((t) => nameKey(t.label) === k);
  if (e) e.n++; else state.taskCat.push({ label, n: 1 });
  save();
  return true;
}
ACTIONS_X['task-add'] = () => {
  const c = curClient(), el = $('#tNew');
  if (!c || !el) return;
  if (addTask(c, el.value)) { render({ keepScroll: true }); const n = $('#tNew'); if (n) n.focus({ preventScroll: true }); } else el.focus();
};
ACTIONS_X['task-sug'] = (t) => { const c = curClient(); if (c && addTask(c, t.dataset.label)) { buzz(); render({ keepScroll: true }); } };
ACTIONS_X['task-toggle'] = (t) => { const c = curClient(), k = c && c.tasks.find((x) => x.id === t.dataset.tid); if (!k) return; k.done = !k.done; save(); buzz(); render({ keepScroll: true }); };
ACTIONS_X['task-del'] = (t) => {
  const c = curClient(); if (!c) return;
  const undo = snapshot();
  c.tasks = c.tasks.filter((x) => x.id !== t.dataset.tid); save();
  render({ keepScroll: true }); toast('Tâche supprimée', undo);
};
ON_INPUT['task-in'] = (el) => { const c = curClient(), s = $('#tSug'); if (c && s) s.innerHTML = taskSugHTML(c, el.value); };

/* ───── terminer la visite ───── */
ACTIONS_X['finish-visit'] = () => { const c = curClient(); if (c) openFinishSheet(c); };
function openFinishSheet(c) {
  const t = today(), open = c.tasks.filter((x) => !x.done).length;
  const wrap = openSheet({
    title: 'Terminer la visite',
    body: `<form id="sheetForm" class="form" novalidate autocomplete="off">
      <p class="lead">${esc(c.name)}</p>
      <div class="two">${field('fDate', 'Date de la visite', `<input id="fDate" type="date" value="${t}" max="${t}">`)}${field('fNext', 'Prochain RDV (facultatif)', `<input id="fNext" type="date" min="${t}">`)}</div>
      <div id="fWarn" aria-live="polite"></div>
      <label class="check"><input id="fCount" type="checkbox" checked><span id="fCountTxt"></span></label>
      ${open ? `<label class="check"><input id="fCarry" type="checkbox" checked><span>Reporter ${plural(open, 'tâche non faite', 'tâches non faites')} à la prochaine visite</span></label>` : ''}
      ${field('fRep', 'Reprise de périmés pendant la visite (facultatif)', '<input id="fRep" type="text" inputmode="decimal" placeholder="Montant en €, vide = aucune" enterkeyhint="done">')}
      ${field('fGoal', 'Buts de la prochaine visite (facultatif)', '<textarea id="fGoal" placeholder="Il sera en haut de la fiche à ta prochaine visite"></textarea>')}
      <p class="err" id="fErr" role="alert"></p>
    </form>`,
    foot: `<button type="button" class="btn grow" data-act="sheet-close">Annuler</button><button type="submit" form="sheetForm" class="btn primary grow">Terminer</button>`,
  });
  const $$ = (s) => $(s, wrap);
  const upd = () => {
    const d = $$('#fDate').value, y = ISO_RE.test(d) ? +d.slice(0, 4) : curYear(), n = visitsOf(c, y), tg = targetOf(c);
    $$('#fCountTxt').textContent = `Ajouter 1 au compteur ${y} (${n} → ${n + 1}${tg ? ' sur ' + tg : ''})`;
  };
  $$('#fDate').addEventListener('change', upd);
  upd();
  const warn = () => { const d = $$('#fNext').value; $$('#fWarn').innerHTML = ISO_RE.test(d) ? restWarnHTML(dateAlerts(c, d, ''), ' in-sheet') : ''; };
  ['input', 'change'].forEach((k) => $$('#fNext').addEventListener(k, warn));
  $$('#sheetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const date = $$('#fDate').value;
    if (!ISO_RE.test(date)) { $$('#fErr').textContent = 'Choisis la date de la visite.'; return; }
    const rep = parseMoney($$('#fRep').value);
    if (rep == null) { $$('#fErr').textContent = 'Montant de la reprise illisible : écris par exemple 125,50.'; $$('#fRep').focus(); return; }
    const undo = snapshot(), y = +date.slice(0, 4), next = $$('#fNext').value;
    c.history.push({ id: uid(), date, goal: c.goal.trim(), notes: c.vnotes.trim(), tasks: c.tasks.map((x) => ({ ...x })) });
    c.history.sort((a, b) => a.date.localeCompare(b.date));
    if (rep > 0) c.reprises = c.reprises.concat({ id: uid(), date, n: 1, amt: rep, note: '' }).sort((a, b) => a.date.localeCompare(b.date));
    if ($$('#fCount').checked) setVisits(c, visitsOf(c, y) + 1, y);
    if (!c.lastVisit || date >= c.lastVisit) c.lastVisit = date;
    const carry = !$$('#fCarry') || $$('#fCarry').checked;
    c.tasks = carry ? c.tasks.filter((x) => !x.done).map((x) => ({ ...x, from: x.from || date })) : [];
    c.goal = $$('#fGoal').value.trim(); c.vnotes = '';
    if (c.rdvDate && c.rdvDate <= date) { c.rdvDate = ''; c.rdvTime = ''; }
    if (next) { c.rdvDate = next; c.rdvTime = ''; }
    c.demo = false; save();
    finish(`Visite enregistrée${targetOf(c) ? ` : ${visitsOf(c)}/${targetOf(c)}` : ''}${rep > 0 ? ` · reprise ${fmtEur(rep)}` : ''}`, undo);
  });
}

function taskCatBody() {

  return `<p class="hint">Ces tâches sont proposées sur toutes les fiches. Une nouvelle tâche saisie sur une fiche s'ajoute toute seule ici.</p>
    <div class="row2"><input id="tcNew" type="text" placeholder="Ajouter une tâche fréquente" aria-label="Nouvelle tâche fréquente" data-enter="taskcat-add" enterkeyhint="done"><button class="btn small" data-act="taskcat-add">Ajouter</button></div>
    <ul class="tc-list">${list.map((t) => `<li><span>${esc(t.label)}</span><small>${t.n} fois</small><button class="icon-btn" data-act="taskcat-del" data-label="${esc(t.label)}" aria-label="Retirer ${esc(t.label)}">${icon('x')}</button></li>`).join('') || '<li class="muted">Aucune pour l\'instant.</li>'}</ul>`;

function openTaskCatSheet() { openSheet({ title: 'Tâches fréquentes', body: `<div id="tcBody">${taskCatBody()}</div>`, foot: `<button type="button" class="btn primary grow" data-act="sheet-close">Fermer</button>` }); }

  drawTaskCat(); const n = $('#tcNew'); if (n) n.focus();
};
ACTIONS_X['taskcat-del'] = (t) => { state.taskCat = state.taskCat.filter((x) => x.label !== t.dataset.label); save(); drawTaskCat(); };
ACTIONS_X['open-taskcat'] = () => openTaskCatSheet();


/* ══════════ Reprises de marchandises périmées ══════════
   Une reprise : date, nombre (1 par défaut), montant, note facultative. La fiche affiche le nombre et le montant
   de l'année en cours, plus le total depuis le début ; le Suivi donne le total de tous les magasins. */
const EUR0 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const EUR2 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtEur = (x) => (Number.isInteger(x) ? EUR0 : EUR2).format(x);
const round2 = (x) => Math.round((+x || 0) * 100) / 100;
/* « 125,50 », « 125.5 », « 1 250 € » → nombre ; vide → 0 ; illisible → null. */
function parseMoney(s) {
  const t = String(s || '').replace(/[\s  €]/g, '').replace(',', '.');
  if (!t) return 0;
  return /^\d{1,7}(\.\d{1,2})?$/.test(t) ? round2(t) : null;
}

let repMore = '';
const repOf = (c) => c.reprises || [];
function repStats(c, y) {
  const l = repOf(c).filter((r) => y == null || r.date.slice(0, 4) === String(y));
  return { n: l.reduce((a, r) => a + r.n, 0), sum: round2(l.reduce((a, r) => a + r.amt, 0)) };
}
function repTotals(y = curYear()) {
  return state.clients.reduce((a, c) => { const s = repStats(c, y); return { n: a.n + s.n, sum: round2(a.sum + s.sum), k: a.k + (s.n ? 1 : 0) }; }, { n: 0, sum: 0, k: 0 });
}
const repShort = (c) => { const s = repStats(c, curYear()); return s.n ? `${plural(s.n, 'reprise', 'reprises')} · ${fmtEur(s.sum)}` : 'aucune reprise'; };

function repRow(r) {
  const note = [r.n > 1 ? `${r.n} reprises` : '', r.note].filter(Boolean).join(' · ');
  const amt = r.amt ? fmtEur(r.amt) : 'montant à saisir';
  return `<li><button type="button" class="rep" data-act="rep-edit" data-rid="${r.id}" aria-label="Modifier la reprise du ${esc(dayLabel(r.date))} : ${esc(amt)}${note ? ', ' + esc(note) : ''}">
    <span class="rd">${esc(dayLabel(r.date))}</span><span class="rn">${note ? esc(note) : '<em>Sans note</em>'}</span><b class="ra${r.amt ? '' : ' none'}">${r.amt ? fmtEur(r.amt) : 'à saisir'}</b></button></li>`;
}

function reprisesSection(c) {
  const y = curYear(), cur = repStats(c, y), all = repStats(c);
  const list = repOf(c).map((r, i) => ({ r, i })).sort((a, b) => b.r.date.localeCompare(a.r.date) || b.i - a.i).map((x) => x.r);   /* la plus récente d'abord */
  const shown = repMore === c.id ? list : list.slice(0, 6);
  return `<section class="sec" id="sec-rep">
    <div class="sec-head"><h2>Reprises périmés</h2><button type="button" class="btn small primary" data-act="rep-add">${icon('plus')}Ajouter</button></div>
    <div class="repcard">
      <div class="rc"><b>${cur.n}</b><span>${cur.n > 1 ? 'reprises' : 'reprise'} en ${y}</span></div>
      <div class="rc"><b>${fmtEur(cur.sum)}</b><span>repris en ${y}</span></div>
    </div>
    ${all.n > cur.n ? `<p class="hint">Depuis le début : ${plural(all.n, 'reprise', 'reprises')} · ${fmtEur(all.sum)}</p>` : ''}
    ${shown.length ? `<ul class="replist">${shown.map(repRow).join('')}</ul>` : emptyBox('Aucune reprise enregistrée pour ce magasin.', `<button type="button" class="btn small" data-act="rep-add">${icon('plus')}Ajouter une reprise</button>`)}
    ${list.length > shown.length ? `<button type="button" class="link" data-act="rep-more">Voir les ${list.length - shown.length} autres</button>` : ''}
  </section>`;
}

function openRepSheet(c, id) {
  const r = id ? repOf(c).find((x) => x.id === id) : null;
  if (id && !r) return;
  const t = today();
  const wrap = openSheet({
    title: r ? 'Modifier la reprise' : 'Nouvelle reprise',
    focus: r ? null : '#rpAmt',
    body: `<form id="sheetForm" class="form" novalidate autocomplete="off">
      <p class="lead">${esc(c.name)}</p>
      <div class="two eq">${field('rpDate', 'Date', `<input id="rpDate" type="date" value="${esc(r ? r.date : t)}" max="${t}">`)}${field('rpAmt', 'Montant repris (€)', `<input id="rpAmt" type="text" inputmode="decimal" placeholder="0,00" value="${r && r.amt ? esc(String(r.amt).replace('.', ',')) : ''}" enterkeyhint="done">`)}</div>
      ${field('rpN', 'Nombre de reprises', `<input id="rpN" type="number" inputmode="numeric" min="1" max="99" value="${r ? r.n : 1}">`)}
      <p class="sec-sub" style="margin:-8px 0 0">Mets plus de 1 pour regrouper plusieurs reprises passées en une seule ligne, avec leur montant total.</p>
      ${field('rpNote', 'Note (facultatif)', `<input id="rpNote" type="text" maxlength="160" placeholder="Ex. croquettes chien, DLUO dépassée" value="${esc(r ? r.note : '')}" autocapitalize="sentences">`)}
      <p class="err" id="rpErr" role="alert"></p>
      ${r ? '<button type="button" class="link danger" id="rpDel" style="align-self:flex-start">Supprimer cette reprise</button>' : ''}
    </form>`,
    foot: `<button type="button" class="btn grow" data-act="sheet-close">Annuler</button><button type="submit" form="sheetForm" class="btn primary grow">Enregistrer</button>`,
  });
  const $$ = (s) => $(s, wrap);
  const del = $$('#rpDel');
  if (del) del.addEventListener('click', () => {
    const undo = snapshot();
    c.reprises = c.reprises.filter((x) => x.id !== r.id); save();
    finish('Reprise supprimée', undo);
  });
  $$('#sheetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const date = $$('#rpDate').value, amt = parseMoney($$('#rpAmt').value), err = $$('#rpErr');
    const n = Math.min(99, Math.max(1, Math.floor(+$$('#rpN').value) || 1));
    if (!ISO_RE.test(date)) { err.textContent = 'Choisis la date de la reprise.'; return; }
    if (amt == null) { err.textContent = 'Montant illisible : écris par exemple 125,50.'; $$('#rpAmt').focus(); return; }
    const undo = snapshot(), rec = { id: r ? r.id : uid(), date, n, amt, note: cleanName($$('#rpNote').value).slice(0, 160) };
    c.reprises = c.reprises.filter((x) => x.id !== rec.id).concat(rec).sort((a, b) => a.date.localeCompare(b.date));
    c.demo = false; save();
    finish(r ? 'Reprise modifiée' : `Reprise enregistrée${amt ? ' : ' + fmtEur(amt) : ''}`, undo);
  });
}

/* ══════════ À faire : mes engagements (tous magasins confondus) et mes tâches perso ══════════
   Chaque tâche d'une fiche peut recevoir une échéance (champ due). Sans échéance, elle attend la prochaine visite du magasin.
   L'écran « À faire » rassemble les tâches non faites de tous les magasins et les tâches perso (06d-perso.js), de la plus urgente
   à la moins urgente. */

const DUE_PRESETS = [[0, "Aujourd'hui"], [1, 'Demain'], [3, 'Dans 3 jours'], [7, 'Dans 1 semaine'], [14, 'Dans 2 semaines']];
const TODO_FL = [['all', 'Tout'], ['store', 'Magasins'], ['perso', 'Perso']];

/* Situation d'une échéance par rapport à aujourd'hui (n < 0 : en retard de -n jours). */
function dueInfo(iso) {
  if (!ISO_RE.test(iso || '')) return { kind: 'none', n: 0 };
  const n = diffDays(today(), iso);
  return { kind: n < 0 ? 'late' : n === 0 ? 'today' : n <= 7 ? 'soon' : 'later', n };
}
function dueText(iso) {
  const d = dueInfo(iso);
  if (d.kind === 'late') return `${-d.n} j de retard`;
  if (d.n === 0) return "Aujourd'hui";
  if (d.n === 1) return 'Demain';
  const dt = parseISO(iso), y = dt.getFullYear();
  return fmtShort.format(dt) + (y !== new Date().getFullYear() ? ' ' + y : '');
}

/* Bouton d'échéance d'une tâche : il ouvre le choix de la date. Sans date, c'est un bouton discret « Échéance ».
   cid = « perso » pour une tâche perso. */
function dueBtn(t, cid) {
  if (t.done && !t.due) return '';
  const at = `data-act="task-due" data-tid="${t.id}"${cid ? ` data-cid="${cid}"` : ''} data-fid="u${t.id}"`;
  if (!t.due) return `<button class="due none" ${at} aria-label="Fixer une échéance : ${esc(t.label)}">${icon('plus')}<span>Échéance</span></button>`;
  const d = dueInfo(t.due), late = d.kind === 'late' && !t.done, kind = t.done ? 'done' : d.kind;
  const say = `${late ? 'En retard, échéance' : 'Échéance'} le ${dayLabel(t.due)}`;
  return `<button class="due ${kind}" ${at} aria-label="${esc(say)}. Modifier">${icon(late ? 'alert' : 'cal')}<span>${esc(dueText(t.due))}</span></button>`;
}
const dueChip = (t) => { const b = dueBtn(t); return b ? `<div class="task-due">${b}</div>` : ''; };

/* Une tâche de magasin (cid = identifiant du magasin) ou une tâche perso (cid = « perso »). */
function findTask(cid, tid) {
  if (cid === 'perso') { const t = state.perso.find((x) => x.id === tid); return t ? { t, c: null } : null; }
  const c = getClient(cid), t = c && c.tasks.find((x) => x.id === tid);
  return t ? { t, c } : null;
}

function openDueSheet(cid, tid) {
  const f = findTask(cid, tid);
  if (!f) return;
  const { t, c } = f, td = today(), rec = !c && !!t.rep;
  const row = (iso, label, sub) => `<button type="button" class="duerow${(t.due || '') === iso ? ' on' : ''}" data-d="${iso}"><span>${esc(label)}</span><small>${esc(sub)}</small></button>`;
  const wrap = openSheet({
    title: 'Échéance',
    body: `<form id="sheetForm" class="form" novalidate autocomplete="off">
      <p class="lead">${esc(t.label)}</p>
      <p class="muted">${c ? esc(c.name) : `Tâche perso${rec ? ` · ${esc(repLabel(t).toLowerCase())}` : ''}`}</p>
      <div class="duelist" role="group" aria-label="Choisir une échéance">
        ${DUE_PRESETS.map(([n, l]) => { const iso = addDays(td, n); return row(iso, l, fmtShort.format(parseISO(iso))); }).join('')}
        ${rec ? '' : row('', 'Sans échéance', c ? 'à la prochaine visite' : 'pas de date')}
      </div>
      ${field('tDue', 'Ou une autre date', `<input id="tDue" type="date" value="${esc(t.due || '')}">`)}
    </form>`,
    foot: `<button type="button" class="btn grow" data-act="sheet-close">Annuler</button><button type="submit" form="sheetForm" class="btn primary grow">Enregistrer</button>`,
  });
  const apply = (iso) => {
    if ((t.due || '') === iso || (rec && !iso)) { closeSheet(); return; }
    const undo = snapshot();
    t.due = iso;
    if (!c) fixPerso(t);
    save();
    finish(t.due ? `Échéance : ${dueText(t.due).toLowerCase()}` : 'Échéance retirée', undo);
  };
  wrap.addEventListener('click', (e) => { const b = e.target.closest('.duerow'); if (b) apply(b.dataset.d); });
  $('#sheetForm', wrap).addEventListener('submit', (e) => { e.preventDefault(); const v = $('#tDue', wrap).value; apply(ISO_RE.test(v) ? v : ''); });
}

/* ───── les tâches de tous les magasins et les tâches perso ───── */
function todoCounts() {
  const t0 = today(), n = { late: 0, now: 0, later: 0, none: 0, all: 0, perso: 0 };
  const add = (t, perso) => {
    n.all++;
    if (perso) n.perso++;
    if (!t.due) n.none++; else if (t.due < t0) n.late++; else if (t.due === t0) n.now++; else n.later++;
  };
  for (const c of state.clients) for (const t of c.tasks) if (!t.done) add(t, false);
  for (const t of state.perso) if (!t.done) add(t, true);
  return n;
}
function todoGroups(filter = 'all') {
  const g = { late: [], today: [], soon: [], later: [], none: [] };
  if (filter !== 'perso') for (const c of state.clients) for (const t of c.tasks) if (!t.done) g[dueInfo(t.due).kind].push({ c, t });
  if (filter !== 'store') for (const t of state.perso) if (!t.done) g[dueInfo(t.due).kind].push({ c: null, t });
  const who = (x) => ({ name: x.c ? x.c.name : 'Perso' });
  const cmp = (a, b) => byName(who(a), who(b)) || a.t.label.localeCompare(b.t.label, 'fr');
  for (const k of Object.keys(g)) g[k].sort((a, b) => (a.t.due || '').localeCompare(b.t.due || '') || cmp(a, b));
  /* Sans échéance : les tâches perso d'abord, puis les magasins qui ont un rendez-vous bientôt. */
  const rdv = (x) => (!x.c ? '0000-00-00' : x.c.rdvDate && x.c.rdvDate >= today() ? x.c.rdvDate : '9999-99-99');
  g.none.sort((a, b) => rdv(a).localeCompare(rdv(b)) || cmp(a, b));
  return g;
}

function todoRow({ c, t }) {
  if (!c) {
    const rep = t.rep ? `<span class="td-rep">${icon('repeat')}${esc(repLabel(t))}</span>` : '';
    const last = t.rep && t.last ? `<span class="td-rdv">Fait le ${esc(dayLabel(t.last))}</span>` : '';
    return `<li class="tdrow perso">
    <div class="tdhead">
      <button class="tk" data-act="perso-done" data-pid="${t.id}" aria-label="${esc(t.label)}, tâche perso : marquer comme faite"><span class="box"></span><span class="tt">${esc(t.label)}</span></button>
      <button class="icon-btn sm" data-act="perso-edit" data-pid="${t.id}" aria-label="Modifier la tâche ${esc(t.label)}">${icon('pencil')}</button>
    </div>
    <div class="td-meta">
      <span class="store perso">${icon('user')}<span>Perso</span></span>${dueBtn(t, 'perso')}${rep}${last}
    </div>
  </li>`;
  }
  const rdv = !t.due && c.rdvDate && c.rdvDate >= today() ? `<span class="td-rdv">RDV ${esc(dueText(c.rdvDate).toLowerCase())}</span>` : '';
  return `<li class="tdrow">
    <button class="tk" data-act="todo-done" data-cid="${c.id}" data-tid="${t.id}" aria-label="${esc(t.label)}, ${esc(c.name)} : marquer comme faite"><span class="box"></span><span class="tt">${esc(t.label)}${t.from ? `<small>depuis le ${esc(dayLabel(t.from))}</small>` : ''}</span></button>
    <div class="td-meta">
      <button class="store" data-act="open-client" data-id="${c.id}" aria-label="Ouvrir la fiche de ${esc(c.name)}">${icon('store')}<span>${esc(c.name)}</span></button>
      ${dueBtn(t, c.id)}${rdv}
    </div>
  </li>`;
}

function viewTodo() {
  const n = todoCounts(), g = todoGroups(ui.todo);
  const parts = n.all ? [plural(n.all, 'tâche', 'tâches'), n.late ? `${n.late} en retard` : ''].filter(Boolean) : [];
  const head = `<header class="top"><div>${parts.length ? `<p class="date">${parts.map((x) => `<span class="nw">${esc(x)}</span>`).join(' · ')}</p>` : ''}<h1 class="title t-acc">À faire</h1></div><button class="btn small primary" data-act="perso-add">${icon('plus')}Tâche perso</button></header>`;
  if (!n.all) {
    return head + emptyBox(`<b>Rien à faire pour l'instant.</b><br>Ici arrivent les tâches de « Après le RDV » de tes magasins et tes tâches perso : pointer tes heures, le relevé kilométrique, un dossier à rendre…`,
      `<div class="acts"><button class="btn primary" data-act="perso-add">${icon('plus')}Ajouter une tâche perso</button><button class="btn" data-act="go-home">Voir les magasins</button></div>`)
      + persoDoneLink();

  const chips = `<div class="chips fl" role="group" aria-label="Afficher">${TODO_FL.map(([k, l]) => `<button class="chip" data-act="todo-fl" data-v="${k}" aria-pressed="${ui.todo === k}">${l} <b>${cnt[k]}</b></button>`).join('')}</div>`;
  const sec = (k, title, cls, hint) => (g[k].length

    : '');
  const body = sec('late', 'En retard', 'late') + sec('today', "Aujourd'hui") + sec('soon', 'Sous 7 jours') + sec('later', 'Plus tard')
    + sec('none', 'Sans échéance', '', 'Sans date, une tâche de magasin attend sa prochaine visite. Touche « Échéance » pour lui en donner une.');
  const none = ui.todo === 'perso'
    ? emptyBox(`<b>Aucune tâche perso.</b><br>Pointage, relevé kilométrique, dossier à rendre : note-les ici, avec une date et une répétition si besoin.`, `<button class="btn primary" data-act="perso-add">${icon('plus')}Ajouter une tâche perso</button>`)
    : emptyBox(`<b>Aucune tâche de magasin à faire.</b>`);
  return head + chips + (body || none) + (ui.todo === 'store' ? '' : persoDoneLink());
}

/* Bandeau de l'accueil : seulement quand il y a de l'urgent (échéance aujourd'hui ou dépassée). */
function todoStrip() {
  const n = todoCounts(), urgent = n.late + n.now;
  if (!urgent) return '';

}

/* ══════════ Tâches perso : l'administratif qui n'a pas de magasin ══════════
   Pointer ses heures, le relevé kilométrique, un dossier à rendre… Une tâche perso a une échéance, peut se répéter (chaque
   semaine, une semaine sur deux, chaque mois, chaque fin de mois) et peut devenir un rappel dans l'agenda du téléphone
   (fichier .ics : l'agenda sonne à l'heure choisie, appli fermée). Elles se rangent dans l'écran « À faire ». */

const REP_OPTS = [['', 'Ne se répète pas'], ['w', 'Chaque semaine'], ['w2', 'Toutes les 2 semaines'], ['m', 'Chaque mois (même jour)'], ['me', 'Chaque fin de mois']];
const WD = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const hmOk = (s) => /^([01]\d|2[0-3]):[0-5]\d$/.test(s);

/* ───── calcul des échéances qui se répètent ───── */
const lastDom = (y, m) => new Date(y, m + 1, 0).getDate();   /* dernier jour du mois m (0 à 12, 12 = janvier suivant) */
const endOfMonth = (iso) => { const d = parseISO(iso); return isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
function nextWeekday(wd) {
  for (let i = 0; i < 7; i++) { const iso = addDays(today(), i); if (parseISO(iso).getDay() === wd) return iso; }
  return today();
}
/* L'occurrence qui suit celle du jour iso. */
function stepDue(rep, iso) {
  const d = parseISO(iso), y = d.getFullYear(), m = d.getMonth();
  if (rep === 'w') return addDays(iso, 7);
  if (rep === 'w2') return addDays(iso, 14);
  if (rep === 'm') return isoDate(new Date(y, m + 1, Math.min(d.getDate(), lastDom(y, m + 1))));
  if (rep === 'me') return isoDate(new Date(y, m + 1, lastDom(y, m + 1)));
  return '';
}
/* Prochaine échéance quand on coche la tâche aujourd'hui : l'occurrence suivante, et jamais une date déjà passée
   (si la tâche était en retard de plusieurs semaines, on saute les occurrences manquées). */
function nextDue(t, from = today()) {
  let n = ISO_RE.test(t.due || '') ? t.due : from;
  for (let i = 0; i < 2000; i++) { n = stepDue(t.rep, n); if (!n || n > from) break; }
  return n;
}
/* « Chaque mois » au 29, 30 ou 31 n'existe pas tous les mois : on passe en « fin de mois ». La fin de mois se cale sur le dernier jour. */
function fixPerso(t) {
  if (!t.rep || !ISO_RE.test(t.due || '')) return t;
  if (t.rep === 'm' && +t.due.slice(8, 10) > 28) t.rep = 'me';
  if (t.rep === 'me') t.due = endOfMonth(t.due);
  return t;
}
function repLabel(t) {
  const d = ISO_RE.test(t.due || '') ? parseISO(t.due) : null;
  if (t.rep === 'w') return d ? `Chaque ${WD[d.getDay()]}` : 'Chaque semaine';
  if (t.rep === 'w2') return d ? `Un ${WD[d.getDay()]} sur deux` : 'Toutes les 2 semaines';
  if (t.rep === 'm') return d ? `Le ${d.getDate() === 1 ? '1er' : d.getDate()} de chaque mois` : 'Chaque mois';
  if (t.rep === 'me') return 'Chaque fin de mois';
  return '';
}

/* Remet les tâches perso d'une sauvegarde ou d'un enregistrement dans un état cohérent (appelé par sanitize). */
function sanitizePerso(a) {
  const str = (x) => (typeof x === 'string' ? x : x == null ? '' : String(x));
  const t0 = today(), seen = new Set(), out = [];
  for (const x of (Array.isArray(a) ? a : [])) {
    if (!x || typeof x !== 'object') continue;
    const label = cleanName(str(x.label)).slice(0, 120);
    if (!label) continue;
    let id = str(x.id) || uid();
    if (seen.has(id)) id = uid();
    seen.add(id);
    const t = {
      id, label, done: !!x.done, doneOn: ISO_RE.test(str(x.doneOn)) ? str(x.doneOn) : '', due: ISO_RE.test(str(x.due)) ? str(x.due) : '',
      rep: ['w', 'w2', 'm', 'me'].includes(x.rep) ? x.rep : '', at: hmOk(str(x.at)) ? str(x.at) : '', last: ISO_RE.test(str(x.last)) ? str(x.last) : '',
    };
    if (t.rep && !t.due) t.rep = '';   /* une répétition demande une date de départ */
    if (t.rep) t.done = false;         /* une tâche qui se répète n'est jamais « terminée » */
    fixPerso(t);
    if (t.done && !t.doneOn) t.doneOn = t0;
    if (t.done && diffDays(t.doneOn, t0) > 90) continue;   /* terminées depuis plus de 3 mois : oubliées */
    out.push(t);
    if (out.length >= 300) break;
  }
  return out;
}

/* ───── agenda du téléphone : fichier .ics ───── */
const icsEsc = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function icsFold(line) {
  let out = '', s = line;
  while (s.length > 70) { out += s.slice(0, 70) + '\r\n '; s = s.slice(70); }
  return out + s;
}
/* Un événement de 30 minutes à la date d'échéance, avec une alarme au début et, si la tâche se répète, sa répétition.
   Les heures sont « flottantes » (sans fuseau) : l'agenda les lit à l'heure locale du téléphone. */
function buildIcs(t) {
  const p2 = (n) => String(n).padStart(2, '0');
  const [h, m] = (t.at || '09:00').split(':').map(Number);
  const endMin = h * 60 + m + 30, endDay = endMin >= 1440 ? addDays(t.due, 1) : t.due;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const d = parseISO(t.due), day = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][d.getDay()];
  const rr = { w: `FREQ=WEEKLY;BYDAY=${day}`, w2: `FREQ=WEEKLY;INTERVAL=2;BYDAY=${day}`, m: `FREQ=MONTHLY;BYMONTHDAY=${d.getDate()}`, me: 'FREQ=MONTHLY;BYMONTHDAY=-1' }[t.rep];
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tournee//Rappel//FR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    `UID:perso-${t.id}@tournee`, `DTSTAMP:${stamp}`,
    `DTSTART:${t.due.replace(/-/g, '')}T${p2(h)}${p2(m)}00`, `DTEND:${endDay.replace(/-/g, '')}T${p2(Math.floor((endMin % 1440) / 60))}${p2(endMin % 60)}00`,
    `SUMMARY:${icsEsc(t.label)}`, ...(rr ? [`RRULE:${rr}`] : []), 'DESCRIPTION:Rappel créé depuis Tournée.',
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(t.label)}`, 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'];
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
function downloadFile(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
/* iPhone : pas de dossier « Téléchargements » à portée de main, on passe par la feuille « Partager » (Fichiers, Mail, AirDrop…).
   Renvoie 'shared', 'cancelled' ou 'downloaded'. Ailleurs : téléchargement classique. */
async function saveFile(name, text, type) {
  if (IOS && typeof navigator.share === 'function' && typeof navigator.canShare === 'function') {
    for (const t of [String(type).split(';')[0], 'text/plain']) {
      try {
        const file = new File([text], name, { type: t });
        if (!navigator.canShare({ files: [file] })) continue;
        await navigator.share({ files: [file], title: name });
        return 'shared';
      } catch (e) {
        if (e && e.name === 'AbortError') return 'cancelled';
      }
    }
  }
  downloadFile(name, text, type);
  return 'downloaded';
}
const slug = (s) => fold(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'tache';

/* ───── feuille « Tâche perso » ───── */
const PERSO_TPL = [
  { label: 'Pointer mes heures', rep: 'w', at: '16:30', first: () => nextWeekday(5) },
  { label: 'Relevé kilométrique', rep: 'me', at: '17:00', first: () => endOfMonth(today()) },
];
function persoSheet(pid) {
  let cur = pid ? state.perso.find((x) => x.id === pid) : null;
  if (pid && !cur) return;
  let created = false;
  const wrap = openSheet({
    title: 'Tâche perso',
    focus: cur ? null : '#pfLabel',
    body: `<form id="sheetForm" class="form" novalidate autocomplete="off">
      ${field('pfLabel', 'Tâche', `<input id="pfLabel" type="text" value="${esc(cur ? cur.label : '')}" maxlength="120" autocapitalize="sentences" enterkeyhint="done" placeholder="Ex. Finaliser le dossier mutuelle">`)}
      ${cur ? '' : `<div class="chips" role="group" aria-label="Modèles">${PERSO_TPL.map((p, i) => `<button type="button" class="chip" data-tpl="${i}">${esc(p.label)}</button>`).join('')}</div>`}
      ${field('pfDate', 'Échéance', `<input id="pfDate" type="date" value="${esc(cur ? cur.due : '')}">`)}
      <div class="chips" role="group" aria-label="Choisir la date rapidement">
        <button type="button" class="chip" data-d="0">Aujourd'hui</button><button type="button" class="chip" data-d="1">Demain</button><button type="button" class="chip" data-d="7">Dans 1 semaine</button><button type="button" class="chip" data-d="eom">Fin du mois</button><button type="button" class="chip" data-d="">Sans date</button>

/* ══════════ Jours de repos des responsables ══════════
   Chaque responsable peut avoir un ou plusieurs jours de repos fixes et, en plus, une demi-journée fixe (matin ou après-midi).
   Ils s'affichent sur la fiche, sous le téléphone, et préviennent quand un rendez-vous tombe un jour d'absence.
   Jours numérotés comme Date.getDay() : 0 = dimanche … 6 = samedi. */
const WEEK = [1, 2, 3, 4, 5, 6, 0];                         /* lundi → dimanche */
const WD3 = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
const PART_LABEL = { am: 'matin', pm: 'après-midi' };
const NOON = '12:30';                                       /* avant : matin ; à partir de : après-midi */

const dayNum = (x) => (typeof x === 'number' || (typeof x === 'string' && /^\d$/.test(x)) ? +x : -1);

/* Remet les jours de repos d'une sauvegarde ou d'une saisie dans un état cohérent (appelé par sanitize). */
function cleanOff(a) {
  const set = new Set();
  for (const x of (Array.isArray(a) ? a : [])) { const n = dayNum(x); if (Number.isInteger(n) && n >= 0 && n <= 6) set.add(n); }
  return set.size >= 7 ? [] : WEEK.filter((d) => set.has(d));
}
function cleanHalf(h, off) {
  if (!h || typeof h !== 'object') return null;
  const d = dayNum(h.d);
  if (!Number.isInteger(d) || d < 0 || d > 6 || (h.p !== 'am' && h.p !== 'pm') || (off || []).includes(d)) return null;
  return { d, p: h.p };
}

const offOf = (p) => (p && Array.isArray(p.off) ? p.off : []);
const halfOf = (p) => (p && p.half && typeof p.half === 'object' ? p.half : null);
const hasRest = (p) => offOf(p).length > 0 || !!halfOf(p);
/* « mardi et jeudi » ; « jeudi après-midi » */
const restDays = (p) => listFr(WEEK.filter((d) => offOf(p).includes(d)).map((d) => WD[d]));
const restHalf = (p) => { const h = halfOf(p); return h ? `${WD[h.d]} ${PART_LABEL[h.p]}` : ''; };
const restSentence = (p) => [restDays(p) ? `repos ${restDays(p)}` : '', restHalf(p) ? `demi-journée ${restHalf(p)}` : ''].filter(Boolean).join(', ');

/* Pastilles affichées sous le nom du responsable (fiche). */
function offsHTML(p) {
  const a = restDays(p), b = restHalf(p);
  if (!a && !b) return `<span class="offs"><span class="off add">${icon('plus')}Jour de repos</span></span>`;
  return `<span class="offs">${a ? `<span class="off">${icon('moon')}Repos ${esc(a)}</span>` : ''}${b ? (a ? `<span class="off half">+ ${esc(b)}</span>` : `<span class="off">${icon('moon')}Repos ${esc(b)}</span>`) : ''}</span>`;
}

/* Qui est absent à cette date (et à cette heure, si on la connaît) ? Renvoie une liste de { p, day, text }. */
function restConflicts(c, iso, time) {
  if (!c || !Array.isArray(c.contacts) || !ISO_RE.test(iso || '')) return [];
  const wd = parseISO(iso).getDay(), out = [];
  for (const p of c.contacts) {
    if (offOf(p).includes(wd)) { out.push({ p, day: true, text: `${p.name} est en repos le ${WD[wd]}` }); continue; }
    const h = halfOf(p);
    if (h && h.d === wd) {
      const part = /^\d{2}:\d{2}$/.test(time || '') ? (time < NOON ? 'am' : 'pm') : '';
      if (!part || part === h.p) out.push({ p, day: false, text: `${p.name} ne travaille pas le ${WD[wd]} ${PART_LABEL[h.p]}` });
    }
  }
  return out;
}
const futureConflicts = (c) => (c.rdvDate && c.rdvDate >= today() ? restConflicts(c, c.rdvDate, c.rdvTime) : []);
const restWarnHTML = (list, cls = '') => (list.length
  ? `<p class="restwarn${cls}" role="status">${icon('alert')}<span>${list.map((x) => esc(x.text)).join('<br>')}</span></p>`
  : '');


/* ══════════ Prochaine visite : jour, heure, jours fériés, buts ══════════
   Un bouton de la fiche ouvre une feuille où l'on choisit le jour, l'heure (facultative) et les buts de la visite.
   Le rendez-vous est le même que dans « Modifier » (rdvDate, rdvTime) ; les buts sont ceux que « Terminer la visite » range dans l'historique (goal).
   Les jours fériés sont calculés sur place, sans réseau : fêtes fixes, Pâques et les jours qui en dépendent.
   En Alsace-Moselle (codes postaux 57, 67 et 68) s'y ajoutent le Vendredi saint et le 26 décembre. */

/* Date de Pâques d'une année (algorithme de Meeus, Jones et Butcher), au format AAAA-MM-JJ. */
function easterISO(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
