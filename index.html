  const n = h + l - 7 * m + 114;

const HOL_CACHE = {};
function holidaysOfYear(y) {

  const add = (iso, name, local) => { const o = m[iso]; if (o) { o.name += ' et ' + name; if (!local) o.local = false; } else m[iso] = { name, local: !!local }; };
  add(`${y}-01-01`, "Jour de l'An");
  add(addDays(e, 1), 'Lundi de Pâques');
  add(`${y}-05-01`, 'Fête du Travail');
  add(`${y}-05-08`, 'Victoire 1945');
  add(addDays(e, 39), 'Ascension');
  add(addDays(e, 50), 'Lundi de Pentecôte');
  add(`${y}-07-14`, 'Fête nationale');
  add(`${y}-08-15`, 'Assomption');

  add(`${y}-11-11`, 'Armistice 1918');

const MAP_S = 1000;                                   /* unités de carte par degré de latitude */
const MAP_LAT0 = 48.55, MAP_LON0 = 6.9, MAP_KX = Math.cos(MAP_LAT0 * Math.PI / 180);
const px = (lon) => (lon - MAP_LON0) * MAP_KX * MAP_S;
const py = (lat) => -(lat - MAP_LAT0) * MAP_S;
const hasPos = (c) => c.lat != null && c.lon != null;
const K_MIN = 0.08, K_MAX = 14;
const clampK = (k) => Math.min(K_MAX, Math.max(K_MIN, k));
const mp = { k: 0.3, tx: 0, ty: 0, w: 360, h: 420, fit: true, ready: false, sel: '', raf: 0, r: 8 };
const DEP_NAMES = { 10: 'Aube', 25: 'Doubs', 52: 'Haute-Marne', 54: 'Meurthe-et-Moselle', 55: 'Meuse', 57: 'Moselle', 67: 'Bas-Rhin', 68: 'Haut-Rhin', 70: 'Haute-Saône', 88: 'Vosges', 90: 'Territoire de Belfort' };
let MAP_BG = '', MAP_BB = null, MAP_DEPLAB = null;

function mapBG() {
  if (MAP_BG) return MAP_BG;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  MAP_DEPLAB = [];
  MAP_BG = GEO.deps.map((dep) => {
    let d = '', big = null;
    for (const ring of dep.r) {
      for (let i = 0; i < ring.length; i += 2) {
        const x = px(ring[i]), y = py(ring[i + 1]);
        d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
      d += 'Z';
      if (!big || ring.length > big.length) big = ring;
    }
    if (big) {
      let a = 1e9, b = -1e9, c = 1e9, e = -1e9;
      for (let i = 0; i < big.length; i += 2) { a = Math.min(a, big[i]); b = Math.max(b, big[i]); c = Math.min(c, big[i + 1]); e = Math.max(e, big[i + 1]); }
      MAP_DEPLAB.push({ n: DEP_NAMES[dep.c] || dep.c, main: dep.m, x: px((a + b) / 2), y: py((c + e) / 2) });
    }
    return `<path class="mdep${dep.m ? '' : ' out'}" d="${d}"/>`;
  }).join('');
  MAP_BB = GEO.deps.length ? [x0, y0, x1, y1] : [-400, -400, 400, 400];
  return MAP_BG;
}

const shortName = (n) => { const s = prettyCity(n); return s.length > 22 ? s.slice(0, 21) + '…' : s; };
const markR = () => (mp.k < 0.7 ? 6 : mp.k < 2.5 ? 8 : 10);
const KIND_ORDER = { none: 0, full: 1, ok: 2, soon: 3, late: 4, bad: 5 };

/* ───── noms de villes : les plus peuplées d'abord, jamais l'une sur l'autre ───── */
const CITIES = GEO.cities;   /* triées par population décroissante */
const ctyTier = (p) => (p >= 50000 ? 1 : p >= 15000 ? 2 : 3);
const CTY_FS = [0, 14, 12.5, 11.5];
let ctyW = null;
const ctyHTML = (c, i) => { const t = ctyTier(c.p); return `<g class="cty t${t}" data-i="${i}"><circle r="${t === 1 ? 3.4 : t === 2 ? 2.8 : 2.4}"/><text x="6" y="4">${esc(c.n)}</text></g>`; };
function ctyMeasure() {
  if (ctyW) return;
  let ctx = null;
  try { ctx = document.createElement('canvas').getContext('2d'); } catch (e) { ctx = null; }
  const fam = getComputedStyle(document.body).fontFamily || 'sans-serif';
  ctyW = CITIES.map((c) => {
    const fs = CTY_FS[ctyTier(c.p)];
    if (ctx) { ctx.font = `700 ${fs}px ${fam}`; return Math.ceil(ctx.measureText(c.n).width) + 12; }
    return Math.ceil(c.n.length * fs * 0.6) + 12;
  });
}
/* Plus on zoome, plus on affiche de villes : on garde chaque nom tant qu'il ne recouvre pas celui d'une ville plus grande. */
function mapCities() {
  const fg = $('#mfg');
  if (!fg) return;
  ctyMeasure();
  if (!mp.cty) { mp.cty = []; fg.querySelectorAll('.cty').forEach((g) => { mp.cty[+g.dataset.i] = g; }); }
  const k = mp.k, minP = k < 0.4 ? 12000 : k < 0.8 ? 7000 : k < 1.6 ? 4500 : 0;
  const R = mp.r * 0.6 + 2;
  const pts = (mp.pts || []).map((q) => [q[0] * k + mp.tx, q[1] * k + mp.ty]).filter((q) => q[0] > -40 && q[0] < mp.w + 40 && q[1] > -40 && q[1] < mp.h + 40);
  const boxes = [];
  const clash = (b) => boxes.some((o) => b[0] < o[2] + 2 && b[2] > o[0] - 2 && b[1] < o[3] + 1 && b[3] > o[1] - 1);
  const dots = (b) => { let n = 0; for (const q of pts) if (q[0] > b[0] - R && q[0] < b[2] + R && q[1] > b[1] - R && q[1] < b[3] + R) n++; return n; };
  mp.cty.forEach((g, i) => {
    const c = CITIES[i];
    let on = false, x = 0, y = 0, pick = null;
    if (c && c.p >= minP) {
      x = px(c.lo) * k + mp.tx; y = py(c.la) * k + mp.ty;
      if (x > 3 && x < mp.w - 3 && y > 8 && y < mp.h - 6) {
        const t = ctyTier(c.p), fs = CTY_FS[t], hh = fs / 2 + 3, w = ctyW[i];
        /* quatre places possibles autour du point : on garde celle qui gêne le moins (autres noms, bord de la carte, repères clients) */
        const opts = [
          { b: [x - 5, y - hh, x + w, y + hh], tx: 6, ty: fs > 13 ? 5 : 4, a: 'start' },
          { b: [x - w, y - hh, x + 5, y + hh], tx: -6, ty: fs > 13 ? 5 : 4, a: 'end' },
          { b: [x - w / 2, y - 7 - 2 * hh, x + w / 2, y - 5], tx: 0, ty: -8, a: 'middle' },
          { b: [x - w / 2, y + 5, x + w / 2, y + 7 + 2 * hh], tx: 0, ty: fs + 5, a: 'middle' },
        ].filter((o) => t === 1 || !clash(o.b))
          .map((o) => ({ ...o, d: dots(o.b), pen: o.b[0] < 2 || o.b[2] > mp.w - 2 ? 100 : 0 })).sort((a, b) => a.pen + a.d - b.pen - b.d);
        const best = opts[0];
        if (best && (t === 1 || (best.pen === 0 && (t === 2 || best.d < 1)))) { boxes.push(best.b); pick = best; on = true; }
      }
    }
    if (on) {
      g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
      const key = pick.a + pick.ty;
      if (g._pos !== key) {
        g._pos = key;
        const tx = g._t || (g._t = g.querySelector('text'));
        tx.setAttribute('x', pick.tx); tx.setAttribute('y', pick.ty); tx.setAttribute('text-anchor', pick.a);
      }
    }
    if (on !== g._on) { g._on = on; g.classList.toggle('on', on); }
    if (on) { const nd = pts.some((q) => Math.abs(q[0] - x) < 4 && Math.abs(q[1] - y) < 4); if (nd !== g._nd) { g._nd = nd; g.classList.toggle('nd', nd); } }   /* le point de la ville s'efface s'il y a un repère client au même endroit */
  });
  /* un nom de département qui gênerait un nom de ville s'efface */
  if (k < 1) (mp.mdn || (mp.mdn = [...fg.querySelectorAll('.mdn')])).forEach((g) => {
    const hide = !!g._w && boxes.some((o) => g._sx - g._w / 2 < o[2] && g._sx + g._w / 2 > o[0] && g._sy - 10 < o[3] && g._sy + 5 > o[1]);
    if (hide !== g._h) { g._h = hide; g.style.visibility = hide ? 'hidden' : ''; }
  });
}
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { ctyW = null; if (view.name === 'carte') mapApply(); }); } catch (e) { /* ignoré */ }

/* Taille d'un repère selon son segment : les F10 ressortent, les hors programme s'effacent un peu. */
const segDelta = (c) => (c.cls === 'F10' ? 2 : !c.cls || c.cls === 'F0' ? -1 : 0);
const segRank = (c) => { const i = CLS_ORDER.indexOf(c.cls); return i < 0 ? -1 : CLS_ORDER.length - i; };   /* F10 dessiné par-dessus les autres */

function markerHTML(c, r) {
  const pos = ui.sel.indexOf(c.id), d = pos < 0 && segMode() ? segDelta(c) : 0, q = r + d;
  return `<g class="mk${mp.sel === c.id ? ' sel' : ''}${pos >= 0 ? ' pick' : ''}" data-id="${c.id}" data-x="${px(c.lon).toFixed(1)}" data-y="${py(c.lat).toFixed(1)}" data-d="${d}"${colAttr(c)}>`
    + `<circle class="hit" r="${q + 10}"/><circle class="ring" r="${q + 5}"/><circle class="dot" r="${q}"/>`
    + (pos >= 0 ? `<text class="num" y="1">${pos + 1}</text>` : '')
    + `<text class="lab" y="${-(q + 7)}">${esc(shortName(c.name))}</text></g>`;
}

function mapDraw() {
  const fg = $('#mfg');
  if (!fg) return;
  mapBG();
  const r = (mp.r = markR());
  const list = state.clients.filter((c) => hasPos(c) && matchAll(c))
    .sort((a, b) => (mp.sel === a.id) - (mp.sel === b.id) || (segMode() ? segRank(a) - segRank(b) : KIND_ORDER[visitStatus(a).kind] - KIND_ORDER[visitStatus(b).kind]));
  fg.innerHTML = MAP_DEPLAB.map((d) => `<text class="mdn${d.main ? '' : ' out'}" data-x="${d.x.toFixed(1)}" data-y="${d.y.toFixed(1)}">${esc(d.n)}</text>`).join('')
    + CITIES.map((c, i) => (ctyTier(c.p) > 2 ? ctyHTML(c, i) : '')).join('')
    + list.map((c) => markerHTML(c, r)).join('')
    + CITIES.map((c, i) => (ctyTier(c.p) <= 2 ? ctyHTML(c, i) : '')).join('');   /* grandes et moyennes villes : par-dessus les repères, placées là où elles en cachent le moins */
  mp.cty = null; mp.mdn = null; mp.pts = list.map((c) => [px(c.lon), py(c.lat)]);
  mapApply();
}

function mapApply() {
  const bg = $('#mbg'), fg = $('#mfg'), svg = $('#mapsvg');
  if (!bg || !fg || !svg) return;
  bg.setAttribute('transform', `translate(${mp.tx.toFixed(1)} ${mp.ty.toFixed(1)}) scale(${mp.k.toFixed(4)})`);
  const dl = mp.k < 1;
  svg.classList.toggle('lbl', mp.k >= 3.2);
  svg.classList.toggle('dep-lab', dl);
  fg.querySelectorAll('[data-x]').forEach((g) => {
    let x = g.dataset.x * mp.k + mp.tx;
    if (dl && g.classList.contains('mdn')) {   /* le nom d'un département reste lisible : jamais coupé par le bord de la carte */
      const w = +g.dataset.w || (g.dataset.w = Math.round(g.getComputedTextLength()));
      x = Math.min(mp.w - w / 2 - 6, Math.max(w / 2 + 6, x));
      g._w = w; g._sx = x; g._sy = g.dataset.y * mp.k + mp.ty;
    }
    g.setAttribute('transform', `translate(${x.toFixed(1)} ${(g.dataset.y * mp.k + mp.ty).toFixed(1)})`);
  });
  mapCities();
  const r = markR();
  if (r !== mp.r) {
    mp.r = r;
    fg.querySelectorAll('.mk').forEach((g) => {
      const q = r + (+g.dataset.d || 0);
      g.querySelector('.hit').setAttribute('r', q + 10); g.querySelector('.ring').setAttribute('r', q + 5);
      g.querySelector('.dot').setAttribute('r', q); g.querySelector('.lab').setAttribute('y', -(q + 7));
    });
  }
}
const mapSchedule = () => { if (!mp.raf) mp.raf = requestAnimationFrame(() => { mp.raf = 0; mapApply(); }); };

function mapFit() {
  const pts = state.clients.filter((c) => hasPos(c) && matchAll(c)).map((c) => [px(c.lon), py(c.lat)]);
  mapBG();
  let x0, y0, x1, y1;
  if (pts.length) {
    x0 = Math.min(...pts.map((p) => p[0])); x1 = Math.max(...pts.map((p) => p[0]));
    y0 = Math.min(...pts.map((p) => p[1])); y1 = Math.max(...pts.map((p) => p[1]));
  } else [x0, y0, x1, y1] = MAP_BB;
  const pad = 34, bw = Math.max(x1 - x0, 1), bh = Math.max(y1 - y0, 1);
  const k = pts.length === 1 ? 4 : clampK(Math.min((mp.w - pad * 2) / bw, (mp.h - pad * 2) / bh));
  mp.k = k; mp.tx = mp.w / 2 - ((x0 + x1) / 2) * k; mp.ty = mp.h / 2 - ((y0 + y1) / 2) * k; mp.fit = true;
}
function mapZoomAt(cx, cy, f) {
  const k = clampK(mp.k * f), wx = (cx - mp.tx) / mp.k, wy = (cy - mp.ty) / mp.k;
  mp.k = k; mp.tx = cx - wx * k; mp.ty = cy - wy * k; mp.fit = false;
  mapApply();
}

function mapResize() {
  const svg = $('#mapsvg');
  if (!svg) return;
  const r = svg.getBoundingClientRect();
  mp.w = r.width || mp.w; mp.h = r.height || mp.h;
  svg.setAttribute('viewBox', `0 0 ${mp.w.toFixed(0)} ${mp.h.toFixed(0)}`);
  if (mp.fit) mapFit();
  mapApply();
}

function mapTap(el) {
  const mk = el && el.closest ? el.closest('.mk') : null;
  if (!mk) { if (mp.sel) { mp.sel = ''; mapRefresh(); } return; }
  const id = mk.dataset.id;
  if (ui.selMode) { const i = ui.sel.indexOf(id); if (i >= 0) ui.sel.splice(i, 1); else ui.sel.push(id); buzz(); mp.sel = ''; }
  else mp.sel = id;
  mapRefresh();
}

/* Ramène un client dans la fenêtre (sans changer le zoom) et le fait clignoter un instant. */
function mapReveal(id) {
  const c = getClient(id), g = $(`#mfg .mk[data-id="${id}"]`);
  if (c && hasPos(c) && $('#mapsvg')) {
    const x = px(c.lon) * mp.k + mp.tx, y = py(c.lat) * mp.k + mp.ty;
    if (x < 30 || x > mp.w - 30 || y < 40 || y > mp.h - 30) { mp.tx += mp.w / 2 - x; mp.ty += mp.h / 2 - y; mp.fit = false; mapApply(); }
  }
  if (g) { g.classList.add('flash'); setTimeout(() => g.classList.remove('flash'), 1500); }
}

/* Un doigt : déplacer. Deux doigts : zoomer. Un appui bref sur un repère : le choisir. */
function mapBind(svg) {
  const ptr = new Map();
  let pinch = null, moved = false, down = null;
  const rect = () => svg.getBoundingClientRect();
  svg.addEventListener('pointerdown', (e) => {
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* ignoré */ }
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptr.size === 1) { moved = false; down = { x: e.clientX, y: e.clientY, el: e.target }; }
    if (ptr.size === 2) {
      const [a, b] = [...ptr.values()], r = rect(), cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: mp.k, wx: (cx - mp.tx) / mp.k, wy: (cy - mp.ty) / mp.k };
      moved = true;
    }
  });
  svg.addEventListener('pointermove', (e) => {
    const p = ptr.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptr.size === 1) {
      if (!moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) moved = true;
      if (moved) { mp.tx += dx; mp.ty += dy; mp.fit = false; mapSchedule(); }
    } else if (ptr.size === 2 && pinch) {
      const [a, b] = [...ptr.values()], r = rect(), cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
      mp.k = clampK(pinch.k * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
      mp.tx = cx - pinch.wx * mp.k; mp.ty = cy - pinch.wy * mp.k; mp.fit = false;
      mapSchedule();
    }
  });
  const up = (e) => {
    if (!ptr.delete(e.pointerId)) return;
    if (ptr.size < 2) pinch = null;
    if (ptr.size === 1) moved = true;
    if (e.type === 'pointerup' && !moved && ptr.size === 0 && down) mapTap(down.el);
  };
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', (e) => { e.preventDefault(); const r = rect(); mapZoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.25 : 0.8); }, { passive: false });
}

function mapNote() {
  if (!state.clients.some((c) => hasPos(c) && matchAll(c))) return 'Aucun client ne correspond à ces filtres';
  const miss = state.clients.filter((c) => !hasPos(c) && matchAll(c)).length;
  return 'Position approximative (commune)' + (miss ? ` · ${plural(miss, 'client sans position', 'clients sans position')}` : '');
}
function mapCardHTML() {

  return `<div class="mcard"${colAttr(c)}>

    <div class="mc-acts"><button class="btn small primary" data-act="open-client" data-id="${c.id}">Ouvrir la fiche</button>${geo ? `<a class="btn small" href="${esc(geo)}">${icon('pin')}Y aller</a>` : ''}${c.phone ? `<a class="btn small" href="${esc(telHref(c.phone))}">${icon('phone')}Appeler</a>` : ''}${ui.selMode ? `<button class="btn small${pos >= 0 ? ' primary' : ''}" data-act="sel-toggle" data-id="${c.id}">${pos >= 0 ? 'Retirer de la tournée' : 'Ajouter à la tournée'}</button>` : ''}</div>
  </div>`;
}

/* Haut de la carte : la rangée de puces est à la fois la légende et le filtre ; « Filtres » ouvre le reste. */
function mapTop() {

    <p class="mp-l">${seg ? 'Retard de visite' : 'Segment'}</p>

}

ACTIONS_X['map-zin'] = () => mapZoomAt(mp.w / 2, mp.h / 2, 1.5);

/* Couleur des points : par segment (F10, F6…) ou par retard de visite. Le bouton goutte bascule, le panneau choisit. */

/* ══════════ Préparer une tournée ══════════
   Les clients choisis (Suivi ou Carte) sont ordonnés pour limiter les kilomètres, répartis par jour,
   puis enregistrés comme rendez-vous. Distances à vol d'oiseau, majorées de 30 % pour la route. */
const ROAD = 1.3, KMH = 55;
let plan = null;   /* { order: [id], date, perDay, start, dur } */

function hav(a, b) {
  const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const kmBetween = (a, b) => (hasPos(a) && hasPos(b) ? hav(a, b) * ROAD : null);
const driveMin = (km) => Math.round(((km / KMH) * 60) / 5) * 5;
const hhmm = (t) => `${pad(Math.floor(t / 60) % 24)}:${pad(t % 60)}`;
const nextWorkday = (iso) => { let d = iso; while ([0, 6].includes(parseISO(d).getDay())) d = addDays(d, 1); return d; };

/* Départ au client le plus excentré, puis le plus proche à chaque étape, puis 2-opt pour défaire les croisements. */
function routeOrder(ids) {
  const cl = ids.map(getClient).filter(Boolean);
  const loc = cl.filter(hasPos), unloc = cl.filter((c) => !hasPos(c));
  if (loc.length > 2) {
    const cen = { lat: loc.reduce((s, c) => s + c.lat, 0) / loc.length, lon: loc.reduce((s, c) => s + c.lon, 0) / loc.length };
    let cur = loc.reduce((m, c) => (hav(c, cen) > hav(m, cen) ? c : m));
    const left = new Set(loc), path = [cur];
    left.delete(cur);
    while (left.size) {
      let best = null, bd = Infinity;
      for (const c of left) { const d = hav(cur, c); if (d < bd) { bd = d; best = c; } }
      path.push(best); left.delete(best); cur = best;
    }
    for (let pass = 0, better = true; better && pass < 40; pass++) {
      better = false;
      for (let i = 0; i < path.length - 1; i++) {
        for (let j = i + 1; j < path.length; j++) {
          const a = path[i - 1], b = path[i], c = path[j], d = path[j + 1];
          const before = (a ? hav(a, b) : 0) + (d ? hav(c, d) : 0), after = (a ? hav(a, c) : 0) + (d ? hav(b, d) : 0);
          if (after + 1e-9 < before) { path.splice(i, j - i + 1, ...path.slice(i, j + 1).reverse()); better = true; }
        }
      }
    }
    return [...path, ...unloc].map((c) => c.id);
  }
  return [...loc, ...unloc].map((c) => c.id);
}

function planDays() {
  const days = [];
  let date = nextWorkday(plan.date);
  for (let i = 0; i < plan.order.length; i += plan.perDay) {
    days.push({ date, ids: plan.order.slice(i, i + plan.perDay) });
    date = nextWorkday(addDays(date, 1));
  }
  return days;
}
function planTimes(day) {
  const [h, m] = plan.start.split(':').map(Number);
  let t = h * 60 + m, prev = null;
  return day.ids.map(getClient).filter(Boolean).map((c) => {
    let km = null, mn = 0;
    if (prev) { km = kmBetween(prev, c); if (km != null) { mn = driveMin(km); t += mn; } }
    const row = { c, time: hhmm(t), km, mn };
    t += plan.dur; prev = c;
    return row;
  });
}

function stopHTML(r, date) {
  const geo = geoHref(r.c);
  const rest = holidayAlert(date, r.c.zip).filter((x) => x.local).concat(restConflicts(r.c, date, r.time));
  const sub = [prettyCity(r.c.city), r.c.cls, r.km != null ? `≈ ${Math.round(r.km)} km, ${r.mn} min depuis le précédent` : ''].filter(Boolean).join(' · ');
  const btn = (act, ico, label, cls = '') => `<button type="button" class="icon-btn sm ${cls}" data-act="${act}" data-id="${r.c.id}" aria-label="${label} ${esc(r.c.name)}">${icon(ico)}</button>`;
  return `<div class="stop" data-sid="${r.c.id}"><div class="st-top"><b class="hr">${esc(timeLabel(r.time))}</b><div class="sbody"><span class="sn">${esc(r.c.name)}</span><span class="ss">${esc(sub)}</span>${rest.length ? `<span class="ss warn">${icon('alert')}<span>${esc(rest.map((x) => x.text).join(' · '))}</span></span>` : ''}</div></div>
    <div class="st-acts">${btn('plan-up', 'chev', 'Monter', 'rot-up')}${btn('plan-down', 'chev', 'Descendre', 'rot-down')}${geo ? `<a class="icon-btn sm" href="${esc(geo)}" aria-label="Y aller : ${esc(r.c.name)}">${icon('pin')}</a>` : ''}${btn('plan-rm', 'x', 'Retirer')}</div></div>`;
}
function planHTML() {
  const days = planDays();
  const busy = plan.order.map(getClient).filter((c) => c && c.rdvDate && c.rdvDate >= today()).length;
  const head = `<div class="plan-opts">
      ${field('pDate', 'Premier jour', `<input id="pDate" type="date" value="${plan.date}" min="${today()}" data-on="plan-date">`)}
      ${field('pStart', 'Premier RDV à', `<input id="pStart" type="time" value="${esc(plan.start)}" data-on="plan-start">`)}
      <div class="field"><span>RDV par jour</span><div class="mini-step"><button type="button" class="step sm" data-act="plan-pd" data-d="-1" aria-label="Moins de RDV par jour"${plan.perDay <= 1 ? ' disabled' : ''}>${icon('minus')}</button><b>${plan.perDay}</b><button type="button" class="step sm" data-act="plan-pd" data-d="1" aria-label="Plus de RDV par jour">${icon('plus')}</button></div></div>
      ${field('pDur', "Durée d'un RDV (min)", `<input id="pDur" type="number" inputmode="numeric" step="5" min="15" max="480" value="${plan.dur}" data-on="plan-dur">`)}
    </div>
    <div class="row2 wrap"><button type="button" class="btn small" data-act="plan-opt">Optimiser l'ordre</button><button type="button" class="btn small" data-act="plan-rev">Inverser</button></div>
    ${busy ? `<p class="hint">${plural(busy, 'client a déjà un RDV prévu : il sera remplacé', 'clients ont déjà un RDV prévu : il sera remplacé')}.</p>` : ''}`;
  const body = days.map((day) => {
    const rows = planTimes(day), km = rows.reduce((s, r) => s + (r.km || 0), 0);
    return `<section class="day"><h3>${esc(cap(fmtLong.format(parseISO(day.date))))}<span>${plural(rows.length, 'RDV', 'RDV')}${km ? ` · ≈ ${Math.round(km)} km` : ''}</span></h3>${restWarnHTML(holidayAlert(day.date, ''), ' in-sheet day-w')}${rows.map((r) => stopHTML(r, day.date)).join('')}</section>`;
  }).join('');
  return head + (body || emptyBox('Aucun client dans la tournée.')) + `<p class="hint">Distances à vol d'oiseau majorées de 30 %, à ${KMH} km/h de moyenne : une estimation, pas un itinéraire.</p>`;
}
const drawPlan = () => { const b = $('#planBody'); if (b) b.innerHTML = planHTML(); };

function openTourSheet() {
  const ids = ui.sel.filter((id) => getClient(id));
  if (!ids.length) return;
  plan = { order: routeOrder(ids), date: nextWorkday(addDays(today(), 1)), perDay: 4, start: state.settings.tourStart, dur: state.settings.tourGap };
  openSheet({
    title: 'Planifier la tournée',
    body: `${tfindBox('pq', 'pres', ' in-sheet')}<div id="planBody">${planHTML()}</div>`,
    foot: `<button type="button" class="btn grow" data-act="sheet-close">Annuler</button><button type="button" class="btn primary grow" data-act="plan-save">Enregistrer les RDV</button>`,
  });
}
ACTIONS_X['sel-plan'] = () => openTourSheet();

ON_CHANGE['plan-date'] = (el) => { if (plan && ISO_RE.test(el.value)) { plan.date = el.value; drawPlan(); } };
ON_CHANGE['plan-start'] = (el) => { if (plan && /^\d{2}:\d{2}$/.test(el.value)) { plan.start = el.value; drawPlan(); } };
ON_CHANGE['plan-dur'] = (el) => { if (plan) { plan.dur = Math.min(480, Math.max(15, Math.round(+el.value || plan.dur))); drawPlan(); } };
ACTIONS_X['plan-pd'] = (t) => { if (plan) { plan.perDay = Math.min(12, Math.max(1, plan.perDay + +t.dataset.d)); drawPlan(); } };
ACTIONS_X['plan-opt'] = () => { if (plan) { plan.order = routeOrder(plan.order); drawPlan(); } };
ACTIONS_X['plan-rev'] = () => { if (plan) { plan.order.reverse(); drawPlan(); } };
const planMove = (id, d) => {
  if (!plan) return;
  const i = plan.order.indexOf(id), j = i + d;
  if (i < 0 || j < 0 || j >= plan.order.length) return;
  [plan.order[i], plan.order[j]] = [plan.order[j], plan.order[i]];
  drawPlan();

ACTIONS_X['plan-save'] = () => {

};

/* ───── recherche d'un client à ajouter à la tournée (carte et feuille de planification) ───── */
function tfindMatches(q) {
  const toks = fold(q).split(' ').filter(Boolean);
  if (!toks.length) return [];
  const key = (c) => (fold(c.name).startsWith(toks[0]) ? 0 : 1);
  return state.clients.filter((c) => { const h = fold([c.name, c.city, c.num, c.zip, c.cls, contactNames(c)].join(' ')); return toks.every((t) => h.includes(t)); })
    .sort((a, b) => key(a) - key(b) || byName(a, b));
}
function tfindRows(q, chosen, act) {
  if (!q.trim()) return '';
  const list = tfindMatches(q);
  if (!list.length) return `<p class="tnone">Aucun client ne correspond à « ${esc(q.trim())} ».</p>`;
  const rows = list.slice(0, 6).map((c) => {
    const i = chosen.indexOf(c.id), s = visitStatus(c);
    const sub = [prettyCity(c.city), c.cls, s.t ? `${s.done}/${s.t} visites` : '', hasPos(c) ? '' : 'sans position'].filter(Boolean).join(' · ');
    return `<button type="button" class="tres${i >= 0 ? ' in' : ''}"${colAttr(c)} data-act="${act}" data-id="${c.id}" aria-label="${esc(c.name)} : ${i >= 0 ? 'déjà dans la tournée' : 'ajouter à la tournée'}"><span class="tr-b">${i >= 0 ? i + 1 : icon('plus')}</span><span class="tr-m"><b>${esc(c.name)}</b><small>${esc(sub)}</small></span></button>`;
  }).join('');
  return rows + (list.length > 6 ? `<p class="tmore">${plural(list.length - 6, 'autre', 'autres')} : précise ta recherche.</p>` : '');
}
const tfindBox = (inputId, resId, cls = '') => `<div class="tfind${cls}"><div class="search">${icon('search')}<input id="${inputId}" type="search" data-on="${inputId}" placeholder="Ajouter un client : nom, ville, n°" autocomplete="off" enterkeyhint="search" aria-label="Chercher un client à ajouter à la tournée"></div><div id="${resId}" class="tresl" aria-live="polite"></div></div>`;
const tfindHTML = () => tfindBox('tq', 'tres');

ON_INPUT.tq = (el) => { const r = $('#tres'); if (r) r.innerHTML = tfindRows(el.value, ui.sel, 'tour-pick'); };
ON_INPUT.pq = (el) => { const r = $('#pres'); if (r && plan) r.innerHTML = tfindRows(el.value, plan.order, 'plan-add'); };

/* Sur la carte : le client est ajouté (ou retiré) de la tournée, la carte le ramène à l'écran. */
ACTIONS_X['tour-pick'] = (t) => {
  const id = t.dataset.id, c = getClient(id);
  if (!c) return;
  const i = ui.sel.indexOf(id), inp = $('#tq'), res = $('#tres');
  if (i >= 0) ui.sel.splice(i, 1); else ui.sel.push(id);
  buzz();
  mp.sel = '';
  if (i < 0) { if (inp) { inp.value = ''; inp.blur(); } if (res) res.innerHTML = ''; }
  else if (inp && res) res.innerHTML = tfindRows(inp.value, ui.sel, 'tour-pick');
  mapRefresh();
  if (i < 0) { mapReveal(id); toast(`${c.name} ajouté à la tournée (n° ${ui.sel.length})`); }
};

/* Dans la feuille de planification : le client prend la place qui rallonge le moins le trajet. */
function planInsertAt(c) {
  const seq = plan.order.map(getClient).filter(Boolean);
  if (!hasPos(c)) return plan.order.length;
  let last = -1;
  seq.forEach((x, i) => { if (hasPos(x)) last = i; });
  if (last < 0) return 0;
  let best = last + 1, bd = Infinity;
  for (let i = 0; i <= last + 1; i++) {
    const a = seq[i - 1], b = i <= last ? seq[i] : null;
    const A = a && hasPos(a) ? a : null, B = b && hasPos(b) ? b : null;
    const d = (A ? hav(A, c) : 0) + (B ? hav(c, B) : 0) - (A && B ? hav(A, B) : 0);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
ACTIONS_X['plan-add'] = (t) => {
  const id = t.dataset.id, c = getClient(id);
  if (!plan || !c) return;
  const inp = $('#pq'), res = $('#pres');
  if (!plan.order.includes(id)) { plan.order.splice(planInsertAt(c), 0, id); if (!ui.sel.includes(id)) ui.sel.push(id); buzz(); }
  if (inp) { inp.value = ''; inp.blur(); }
  if (res) res.innerHTML = '';
  drawPlan();
  const el = $(`#planBody .stop[data-sid="${id}"]`);
  if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
};

const RC_MAP = new Map(RC.map((p) => [p.k, p]));
const catIsOn = (p) => !state.catOff.includes(p.k);
const activeProductNames = () => RC.filter(catIsOn).map((p) => p.n);
function prodFormats() { return null; }   /* le site ne donne pas les formats hors connexion : on garde les formats habituels */
function catGroups() {
  const m = new Map();
  RC.forEach((p) => { if (!m.has(p.g)) m.set(p.g, []); m.get(p.g).push(p); });
  return [...m.entries()];
}
function catSummary() {
  if (!RC.length) return 'Aucune référence dans le catalogue.';
  const on = RC.filter(catIsOn).length;
  return on === RC.length ? `Les ${RC.length} références du catalogue sont actives.` : `${plural(on, 'référence active', 'références actives')} sur ${RC.length}.`;
}
function catSetKeys(keys, on) {
  const off = new Set(state.catOff);
  keys.forEach((k) => { if (on) off.delete(k); else off.add(k); });
  state.catOff = [...off];
  save();
}

/* Dans la feuille « référence manquante » : parcourir les références actives, groupées. */
function catBrowseHTML() {
  const act = RC.filter(catIsOn);
  if (!act.length) return '';
  const groups = new Map();
  act.forEach((p) => { if (!groups.has(p.g)) groups.set(p.g, []); groups.get(p.g).push(p); });
  return `<details class="cbrowse"><summary>Parcourir le catalogue (${act.length})</summary>${[...groups].map(([g, l]) => `<h4>${esc(g)}</h4><div class="chips">${l.map((p) => `<button type="button" class="chip" data-name="${esc(p.n)}">${esc(p.n)}</button>`).join('')}</div>`).join('')}</details>`;
}

/* Réglages : activer ou désactiver. */
function catBody(q) {
  const fq = fold(q || '');
  const groups = catGroups().map(([g, l]) => [g, fq ? l.filter((p) => fold(`${p.n} ${g}`).includes(fq)) : l]).filter(([, l]) => l.length);
  if (!groups.length) return emptyBox('Aucune référence ne correspond.');
  return groups.map(([g, l]) => `<details class="cgrp" data-g="${esc(g)}"${fq ? ' open' : ''}>
    <summary><span class="cg-t">${esc(g)}</span><span class="cg-n">${l.filter(catIsOn).length}/${l.length}</span></summary>
    <div class="cg-tools"><button type="button" class="link" data-act="cat-grp" data-g="${esc(g)}" data-v="1">Tout activer</button><button type="button" class="link" data-act="cat-grp" data-g="${esc(g)}" data-v="0">Tout désactiver</button></div>
    <ul class="cprod">${l.map((p) => `<li><label class="switch"><input type="checkbox" data-on="cat-prod" data-k="${p.k}"${catIsOn(p) ? ' checked' : ''}><span class="sw-track" aria-hidden="true"></span><span class="sw-txt">${esc(p.n)}</span></label></li>`).join('')}</ul>
  </details>`).join('');
}
function openCatalogueSheet() {
  openSheet({
    title: 'Produits Royal Canin',
    body: `<p class="hint" id="cSum">${esc(catSummary())}</p>
      <p class="hint">Seules les références actives sont proposées quand tu notes un manquant. Les manquants déjà notés ne bougent pas.</p>
      <div class="row2 wrap"><button type="button" class="btn small" data-act="cat-all" data-v="1">Tout activer</button><button type="button" class="btn small" data-act="cat-all" data-v="0">Tout désactiver</button></div>
      <div class="search" style="margin-top:12px">${icon('search')}<input id="cSearch" type="search" data-on="cat-q" placeholder="Chercher une référence" autocomplete="off" aria-label="Chercher une référence"></div>

}
function catRefresh() {
  const s = $('#cSum'); if (s) s.textContent = catSummary();
  const si = $('#sCatInfo'); if (si) si.textContent = catSummary();
  document.querySelectorAll('#cList details.cgrp').forEach((d) => {
    const l = RC.filter((p) => p.g === d.dataset.g), shown = d.querySelectorAll('input[data-k]');
    const n = d.querySelector('.cg-n'); if (n) n.textContent = `${l.filter(catIsOn).length}/${l.length}`;
    shown.forEach((i) => { i.checked = catIsOn(RC_MAP.get(i.dataset.k)); });
  });
}
ACTIONS_X['open-catalogue'] = () => openCatalogueSheet();
ACTIONS_X['cat-all'] = (t) => { catSetKeys(RC.map((p) => p.k), t.dataset.v === '1'); catRefresh(); };
ACTIONS_X['cat-grp'] = (t) => { catSetKeys(RC.filter((p) => p.g === t.dataset.g).map((p) => p.k), t.dataset.v === '1'); catRefresh(); };
ON_CHANGE['cat-prod'] = (el) => { catSetKeys([el.dataset.k], el.checked); catRefresh(); };
ON_INPUT['cat-q'] = (el) => { const l = $('#cList'); if (l) l.innerHTML = catBody(el.value); };


/* ══════════ Navigation ══════════ */
let view = { name: 'home' };
let homeQuery = '';
const scrollMemo = {};
const viewKey = (v) => v.name + (v.id || '');
const stOf = () => (history.state && typeof history.state === 'object' ? history.state : {});
const keepSt = (o) => ({ ...stOf(), ...o });   /* change l'état de l'entrée courante sans perdre les repères du garde-fou « Retour » */
let lastHash = '#/';

function parseHash() {
  const h = (location.hash || '').replace(/^#/, '') || '/';
  const m = h.match(/^\/c\/([\w-]+)$/);
  if (m) return { name: 'client', id: m[1] };
  if (h === '/promos') return { name: 'promos' };
  if (h === '/suivi') return { name: 'suivi' };
  if (h === '/carte') return { name: 'carte' };
  if (h === '/afaire') return { name: 'afaire' };
  return { name: 'home' };
}

function route(restore) {
  view = parseHash();
  if (view.name === 'client' && !getClient(view.id)) {
    view = { name: 'home' };
    try { history.replaceState(keepSt({ i: stOf().i || 0 }), '', '#/'); } catch (e) { /* ignoré */ }
  }
  lastHash = location.hash || '#/';
  render();
  window.scrollTo(0, restore ? scrollMemo[viewKey(view)] || 0 : 0);
}

function navigate(path) {
  scrollMemo[viewKey(view)] = window.scrollY;
  const i = ((history.state && history.state.i) || 0) + 1;
  try { history.pushState({ i }, '', '#' + path); }
  catch (e) { location.hash = path; return; }
  route(false);
}

/* Retour vers la liste : un vrai retour d'historique si on vient de la liste, sinon on remplace l'adresse. */
function goBackToList(done) {
  const i = history.state && history.state.i;
  if (i > 0) {
    ignorePop++;
    let ran = false;
    const run = () => { if (!ran) { ran = true; route(true); if (done) done(); } };
    pendingAfter = run;
    setTimeout(() => { if (!ran) { ignorePop = Math.max(0, ignorePop - 1); pendingAfter = null; run(); } }, 600);
    history.back();
  } else {
    try { history.replaceState(keepSt({ i: 0 }), '', '#/'); } catch (e) { /* ignoré */ }
    route(true);
    if (done) done();
  }
}

window.addEventListener('popstate', () => {
  if (ignorePop > 0) {
    ignorePop--;
    const f = pendingAfter;
    pendingAfter = null;
    if (f) f();
    return;
  }
  if (sheet) { closeSheet(true); return; }
  if (stOf().base) { backGuard(); return; }
  route(true);
});

/* ══════════ Garde-fou « Retour » et « Actualiser » ══════════
   Sur le premier écran, un « Retour » donné par mégarde ferme la page, et ouverte depuis « Fichiers » il faut aller la rouvrir
   à la main. Au premier appui sur l'écran, on ajoute donc une entrée d'historique (Chrome ignore celles créées sans geste de
   l'utilisateur) : reculer jusqu'à l'entrée de départ prévient au lieu de quitter. Un second « Retour » rapproché laisse partir. */
let backAt = 0;
function armGuard() {
  if (IOS) return;   /* pas de bouton Retour sur iPhone : un balayage depuis le bord revient simplement à l'écran d'avant */
  const s = stOf();
  if (s.i !== 0 || s.gd || s.sheet) return;
  try {
    if (!s.base) history.replaceState({ ...s, base: 1 }, '');
    history.pushState({ i: 0, gd: 1 }, '');
  } catch (e) { /* ignoré */ }
}
function backGuard() {
  const now = Date.now(), twice = now - backAt < 2500;
  backAt = twice ? 0 : now;
  try { history.replaceState(keepSt({}), '', lastHash); } catch (e) { /* ignoré */ }
  if (twice) { toast('Encore un appui sur Retour pour quitter'); try { history.back(); } catch (e) { /* ignoré */ } return; }
  toast('Appuie encore sur Retour pour quitter');
  try { history.pushState({ i: 0, gd: 1 }, '', lastHash); } catch (e) { /* ignoré */ }
}
['click', 'keydown'].forEach((k) => document.addEventListener(k, armGuard, { capture: true, passive: true }));

/* Page ouverte depuis un fichier : après un « Actualiser » ou une sortie elle ne se rouvre pas seule, on demande donc confirmation.
   Appeler, ouvrir le GPS ou écrire un message ne quittent pas la page : pas de question dans ces cas. */
let leaveOk = false;
if (/^(file|content):$/.test(location.protocol)) {
  window.addEventListener('beforeunload', (e) => { if (!leaveOk) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('click', (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (a && /^(tel|geo|sms|mailto):/i.test(a.getAttribute('href'))) { leaveOk = true; setTimeout(() => { leaveOk = false; }, 2500); }
  }, true);
}

/* ══════════ Affichage ══════════ */
function render(opts = {}) {
  if (view.name === 'client' && !getClient(view.id)) view = { name: 'home' };
  const keep = !!opts.keepScroll;
  const y = window.scrollY;
  const ae = document.activeElement;
  const fid = keep && ae && ae.dataset && appEl.contains(ae) ? ae.dataset.fid : null;
  let main, extra = '', nav = null;
  if (view.name === 'client') {
    const c = getClient(view.id);
    main = viewClient(c);
    document.title = `${c.name} - Tournée`;
  } else if (view.name === 'promos') {
    main = viewPromos(); extra = navHTML('promos'); nav = 'promos'; document.title = 'Promos - Tournée';
  } else if (view.name === 'suivi') {
    main = viewSuivi(); extra = navHTML('suivi'); nav = 'suivi'; document.title = 'Suivi - Tournée';
  } else if (view.name === 'carte') {
    main = viewMap(); extra = navHTML('carte'); nav = 'carte'; document.title = 'Carte - Tournée';
  } else if (view.name === 'afaire') {
    main = viewTodo(); extra = navHTML('afaire'); nav = 'afaire'; document.title = 'À faire - Tournée';
  } else {
    main = viewHome(); extra = fabHTML() + navHTML('home'); nav = 'home'; document.title = 'Tournée';
  }
  document.body.classList.toggle('no-nav', !nav);
  appEl.innerHTML = `<main class="app${view.name === 'carte' ? ' map-app' : ''}">${main}</main>${state.clients.length || view.name !== 'home' ? extra : navHTML('home')}`;
  if (view.name === 'home') {
    const q = $('#q');
    if (q) q.value = homeQuery;
    if (homeQuery) $('#clientList').innerHTML = clientListHTML(homeQuery);
  }
  AFTER.forEach((f) => f());
  if (keep) window.scrollTo(0, y);
  if (fid) { const el = appEl.querySelector(`[data-fid="${fid}"]`); if (el) el.focus({ preventScroll: true }); }
}

/* ══════════ Actions (un clic sur un élément data-act) ══════════ */
const ACTIONS = {
  'go-home': () => { if (view.name !== 'home') navigate('/'); else window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); },
  'go-promos': () => { if (view.name !== 'promos') navigate('/promos'); },
  'go-suivi': () => { if (view.name !== 'suivi') navigate('/suivi'); else window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); },
  'go-map': () => { if (view.name !== 'carte') navigate('/carte'); },
  'go-afaire': (t) => { if (t && t.dataset && t.dataset.all) ui.todo = 'all'; if (view.name !== 'afaire') navigate('/afaire'); else window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); },
  'open-client': (t) => navigate('/c/' + t.dataset.id),
  back: () => goBackToList(),
  'new-client': () => openClientSheet(null),
  'edit-client': (t) => openClientSheet(t.dataset.id || (view.name === 'client' ? view.id : null)),
  'add-ref': () => openRefSheet(view.id, null),
  'edit-ref': (t) => openRefSheet(view.id, t.dataset.key),
  'add-promo': (t) => openPromoSheet(t.dataset.scope, null),
  'edit-promo': (t) => openPromoSheet(null, t.dataset.pid),
  'add-centrale': () => openCentraleSheet(null),
  'edit-centrale': (t) => openCentraleSheet(t.dataset.id),
  'open-settings': () => openSettingsSheet(),
  'sheet-close': () => closeSheet(),
  demo: () => { loadDemo(); render(); toast("Données d'exemple ajoutées"); },
  'clear-demo': () => { const undo = snapshot(); clearDemo(); render({ keepScroll: true }); toast("Données d'exemple effacées", undo); },
  backup: async () => {
    try {
      const r = await exportBackup();
      if (r === 'cancelled') return;
      render({ keepScroll: true });
      toast(r === 'shared' ? 'Sauvegarde créée' : 'Sauvegarde enregistrée dans les téléchargements');
    } catch (e) { toast("La sauvegarde n'a pas pu être créée"); }
  },
  anchor: (t) => {
    const el = $(t.dataset.to);
    if (el) el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
  },
  'toggle-item': (t) => {
    const c = getClient(view.id);
    const it = c && c.items.find((i) => i.id === t.dataset.id);
    if (!it) return;
    it.accepted = !it.accepted;
    save(); buzz(); render({ keepScroll: true });
  },
  'toggle-sub': (t) => {
    const c = getClient(view.id);
    if (!c) return;
    const pid = t.dataset.pid;
    c.subs = c.subs.includes(pid) ? c.subs.filter((s) => s !== pid) : [...c.subs, pid];
    save(); buzz(); render({ keepScroll: true });
  },
  'dn-ok': () => { const c = getClient(view.id); if (!c) return; c.dnDate = today(); save(); render({ keepScroll: true }); toast('Fichier DN marqué comme relevé aujourd\'hui'); },
  'clear-dn': () => {
    const c = getClient(view.id);
    if (!c) return;
    const undo = snapshot();
    c.items = []; c.dnDate = today(); save();
    render({ keepScroll: true });
    toast('Liste vidée', undo);
  },
  'drop-accepted': () => {
    const c = getClient(view.id);
    if (!c) return;
    const undo = snapshot();
    const n = c.items.filter((i) => i.accepted).length;
    c.items = c.items.filter((i) => !i.accepted); save();
    render({ keepScroll: true });
    toast(`${plural(n, 'référence retirée', 'références retirées')}`, undo);
  },
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  const f = t && (ACTIONS[t.dataset.act] || ACTIONS_X[t.dataset.act]);
  if (!f) return;
  e.preventDefault();
  f(t, e);
});

const hookKey = (el) => (el && el.dataset && el.dataset.on) || (el && el.id) || '';
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'q') {
    homeQuery = e.target.value;
    const list = $('#clientList');
    if (list) list.innerHTML = clientListHTML(homeQuery);
  }
  const k = hookKey(e.target);
  if (k && ON_INPUT[k]) ON_INPUT[k](e.target, e);
});
document.addEventListener('change', (e) => {
  const k = hookKey(e.target);
  if (k && ON_CHANGE[k]) ON_CHANGE[k](e.target, e);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheet) closeSheet();
  const el = e.target, act = el && el.dataset && el.dataset.enter;
  if (e.key === 'Enter' && act && ACTIONS_X[act]) { e.preventDefault(); ACTIONS_X[act](el, e); }
});

/* Au retour dans l'appli (le lendemain par exemple), les dates affichées sont remises à jour. */
let shownDay = today();
function refreshIfNewDay() {
  if (today() !== shownDay) { shownDay = today(); render({ keepScroll: true }); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); else refreshIfNewDay(); });
window.addEventListener('pagehide', flushSave);
window.addEventListener('focus', refreshIfNewDay);
window.addEventListener('pageshow', refreshIfNewDay);

/* ══════════ Démarrage ══════════ */
state = load();
/* Premier lancement : la liste des clients est déjà dans l'appli, il suffit de la charger. */
if (!state.parcDone) importParc();
try { history.replaceState(keepSt({ i: stOf().i || 0 }), '', location.hash || '#/'); } catch (e) { /* ignoré */ }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignoré */ }
route(false);
